<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SIOA | Under redevelopment</title>
  <meta name="description" content="The Society of Indian Origami Artists website is under redevelopment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#1b0305}
    body{min-height:100svh;overflow:hidden;color:#f0d3c8;font-family:'Cormorant Garamond',Georgia,serif}
    main{position:relative;display:grid;place-items:center;min-height:100svh;padding:32px;text-align:center;isolation:isolate}
    main::before{content:'';position:absolute;inset:0;z-index:-2;background:url('assets/sioa-constant-bg.png') center/cover no-repeat}
    main::after{content:'';position:absolute;inset:0;z-index:-1;background:rgba(24,2,4,.38)}
    .message{width:min(720px,92vw);text-transform:uppercase}
    .ornament{display:flex;flex-direction:column;align-items:center;color:#ae7c76;font-size:1rem;line-height:1}
    .ornament::before{content:'';width:1px;height:52px;margin-bottom:14px;background:#a96361}
    h1{margin-top:42px;font-size:clamp(3.4rem,9vw,7.5rem);font-weight:400;line-height:.9;letter-spacing:.32em;text-indent:.32em;text-shadow:0 3px 24px rgba(10,0,1,.6)}
    p{margin-top:34px;color:#c99d91;font-size:clamp(.82rem,1.3vw,1.05rem);font-weight:500;letter-spacing:.38em;text-indent:.38em}
    @media(max-width:560px){main{padding:24px}.ornament::before{height:38px}h1{font-size:3.25rem;letter-spacing:.25em;text-indent:.25em}p{font-size:.76rem;line-height:1.7;letter-spacing:.25em;text-indent:.25em}}
  </style>
</head>
<body>
  <main>
    <section class="message" aria-labelledby="holdingTitle">
      <div class="ornament" aria-hidden="true">✥</div>
      <h1 id="holdingTitle">SIOA</h1>
      <p>Under redevelopment</p>
    </section>
  </main>
</body>
</html>
