<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body>

    <h2>Set a New Password</h2>
    
    <!-- Input form for the new password -->
    <div>
        <input type="password" id="newPassword" placeholder="Enter new password">
        <button id="updateBtn">Update Password</button>
    </div>

    <!-- Load your Supabase client script here -->
    <script src="path/to/your/supabase-client.js"></script>

    <script>
        // Based on the logic from image_76b923.png
        sbClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                document.getElementById('updateBtn').addEventListener('click', async () => {
                    const newPassword = document.getElementById('newPassword').value;
                    
                    const { error } = await sbClient.auth.updateUser({ 
                        password: newPassword 
                    });

                    if (error) {
                        alert('Error: ' + error.message);
                    } else {
                        alert('Password updated! You can now log in.');
                        window.location.href = '/login.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
