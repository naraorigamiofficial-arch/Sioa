<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIOA | Set New Password</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:         #04080f;
            --surface:    #080e1a;
            --border:     rgba(255,255,255,0.07);
            --cyan:       #2d89b0;
            --cyan-light: #57a6bb;
            --text:       #dce8ed;
            --muted:      rgba(220,232,237,0.38);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* The Premium Grid Background */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(45,137,176,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45,137,176,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(45,137,176,0.10) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        .brand-wordmark {
            display: inline-block;
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            letter-spacing: 0.18em;
            color: var(--text);
            text-decoration: none;
            margin-bottom: 6px;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.08s both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 32px;
            color: var(--text);
            letter-spacing: 0.04em;
        }

        .field { margin-bottom: 24px; }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* Wrapper for the Show Password Toggle */
        .password-wrapper {
            position: relative;
        }

        .field input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 13px 16px;
            padding-right: 60px; /* Room for the toggle button */
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 300;
            outline: none;
            transition: all 0.25s ease;
        }

        .field input::placeholder { color: rgba(220,232,237,0.18); }
        .field input:hover { border-color: rgba(45,137,176,0.25); background: rgba(255,255,255,0.05); }
        .field input:focus { border-color: rgba(45,137,176,0.55); background: rgba(10,22,40,0.60); box-shadow: 0 0 0 3px rgba(45,137,176,0.10); }

        .toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0;
        }

        .toggle-btn:hover { color: var(--text); }

        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            background: var(--cyan);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(45,137,176,0.40); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 400;
            display: none;
        }

        .msg.error   { display: block; background: rgba(201,96,96,0.12); border: 1px solid rgba(201,96,96,0.25); color: #d97070; }
        .msg.success { display: block; background: rgba(45,137,176,0.10); border: 1px solid rgba(45,137,176,0.25); color: var(--cyan-light); }

        .back-link {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.18s both;
        }

        .back-link a { color: var(--cyan-light); text-decoration: none; transition: color 0.2s; }
        .back-link a:hover { color: var(--text); }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="page">
    <div class="brand">
        <a href="/" class="brand-wordmark">SIOA</a>
        <p class="brand-sub">Society of Indian Origami Artists</p>
    </div>

    <div class="card">
        <h2 class="card-title">Set New Password</h2>

        <form id="reset-form" novalidate>
            <div class="field">
                <label for="new-password">Secure Password</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" placeholder="At least 6 characters" required minlength="6">
                    <button type="button" class="toggle-btn" id="toggle-btn">Show</button>
                </div>
            </div>
            
            <button type="submit" class="btn-submit" id="update-btn">Update Password</button>
        </form>

        <div class="msg" id="reset-msg"></div>
    </div>

    <p class="back-link"><a href="/">← Back to Sign In</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const sb = window.supabase.createClient(
        "https://zbgvgzzaejaxrgcjjovc.supabase.co",
        "sb_publishable_gCLTB6WM95Iw6Txcf2fjCA_5fnXPw77"
    );

    // Show/Hide Toggle Logic
    const toggleBtn = document.getElementById('toggle-btn');
    const passwordInput = document.getElementById('new-password');

    toggleBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = 'Hide';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = 'Show';
        }
    });

    // Helper functions for UX consistency
    function showMsg(text, type) {
        const el = document.getElementById('reset-msg');
        el.textContent = text;
        el.className = 'msg ' + type;
    }

    function setLoading(loading, defaultText) {
        const btn = document.getElementById('update-btn');
        btn.disabled = loading;
        btn.innerHTML = loading
            ? `<span class="spinner"></span> Updating…`
            : defaultText;
    }

    // Submit Logic
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = passwordInput.value;

        if (newPassword.length < 6) {
            showMsg('Password must be at least 6 characters.', 'error');
            return;
        }

        setLoading(true, 'Update Password');
        
        const { error } = await sb.auth.updateUser({ password: newPassword });
        
        setLoading(false, 'Update Password');

        if (error) {
            showMsg(error.message, 'error');
        } else {
            showMsg('Password updated! Redirecting to login…', 'success');
            // Redirect to your main login page after 1.5 seconds
            setTimeout(() => window.location.href = '/', 1500);
        }
    });
</script>
</body>
</html>
