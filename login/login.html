<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIOA | Sign In</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:         #04080f;
            --surface:    #080e1a;
            --border:     rgba(255,255,255,0.07);
            --border-mid: rgba(255,255,255,0.12);
            --cyan:       #b86f50;
            --cyan-light: #e0aa90;
            --text:       #dce8ed;
            --muted:      rgba(220,232,237,0.38);
            --error:      #c96060;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(184,111,80,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(184,111,80,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(184,111,80,0.10) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

        .brand-wordmark {
            display: inline-block;
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            letter-spacing: 0.18em;
            color: var(--text);
            text-decoration: none;
            margin-bottom: 6px;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.08s both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .tabs {
            display: flex;
            gap: 0;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--muted);
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .tab.active {
            background: rgba(184,111,80,0.18);
            color: var(--cyan-light);
            border: 1px solid rgba(184,111,80,0.25);
        }

        .panel { display: none; }
        .panel.active { display: block; }

        /* ── India-only notice ── */
        .notice {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            background: rgba(184,111,80,0.07);
            border: 1px solid rgba(184,111,80,0.18);
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .notice svg {
            width: 14px; height: 14px;
            stroke: var(--cyan-light);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .notice-text {
            font-size: 12px;
            font-weight: 400;
            color: rgba(220,232,237,0.55);
            line-height: 1.6;
            letter-spacing: 0.02em;
        }
        .notice-text strong {
            color: var(--cyan-light);
            font-weight: 500;
        }

        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 13px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-mid);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 24px;
        }

        .btn-google:hover {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.20);
            transform: translateY(-1px);
        }

        .btn-google svg { flex-shrink: 0; }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 13px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 300;
            outline: none;
            transition: all 0.25s ease;
        }

        .field input::placeholder { color: rgba(220,232,237,0.18); }

        .field input:hover {
            border-color: rgba(184,111,80,0.25);
            background: rgba(255,255,255,0.05);
        }

        .field input:focus {
            border-color: rgba(184,111,80,0.55);
            background: rgba(10,22,40,0.60);
            box-shadow: 0 0 0 3px rgba(184,111,80,0.10);
        }

        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            background: var(--cyan);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.08);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(184,111,80,0.40); }
        .btn-submit:hover::after { opacity: 1; }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.02em;
            display: none;
        }

        .msg.error   { display: block; background: rgba(201,96,96,0.12); border: 1px solid rgba(201,96,96,0.25); color: #d97070; }
        .msg.success { display: block; background: rgba(184,111,80,0.10); border: 1px solid rgba(184,111,80,0.25); color: var(--cyan-light); }
        .msg.info    { display: block; background: rgba(184,111,80,0.08); border: 1px solid rgba(184,111,80,0.18); color: var(--muted); }

        .back-link {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) 0.18s both;
        }

        .back-link a {
            color: var(--cyan-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link a:hover { color: var(--text); }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
        }
    </style>
    <style>
        :root {
            --bg: #210204;
            --surface: rgba(37, 3, 6, 0.38);
            --border: rgba(226, 177, 157, 0.22);
            --border-mid: rgba(226, 177, 157, 0.42);
            --cyan: #b86f50;
            --cyan-light: #e0aa90;
            --text: #efd0c2;
            --muted: rgba(239, 208, 194, 0.62);
            --error: #e19a91;
            --saffron: #c98a5d;
        }

        html, body {
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans', sans-serif;
            color-scheme: dark;
        }

        body { overflow-x: hidden; }

        body::before {
            inset: 0;
            background: url('../assets/sioa-login-arch.png') center center / cover no-repeat fixed;
            z-index: 0;
        }

        body::after {
            inset: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: none;
            background: rgba(24, 1, 3, 0.16);
            z-index: 0;
        }

        .login-header {
            position: fixed;
            z-index: 10;
            inset: 0 0 auto;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(24px, 4.8vw, 82px);
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .site-mark {
            display: flex;
            align-items: center;
            gap: 24px;
            color: var(--text);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.22rem;
            font-weight: 600;
            letter-spacing: 0.3em;
        }

        .site-mark::after {
            content: '';
            width: 44px;
            height: 1px;
            background: var(--saffron);
            opacity: 0.62;
        }

        .login-nav, .sioa-controls {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .login-nav > a, .sioa-sound, .sioa-language {
            color: var(--muted);
            background: none;
            border: 0;
            border-radius: 0;
            font: 500 0.72rem/1 'Noto Sans', sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .sioa-sound, .sioa-language { cursor: pointer; }
        .sioa-sound, .sioa-language { border-radius: 999px; }
        .sioa-language { border: 1px solid var(--border); padding: 7px 11px; }
        .sioa-language option { background: #310609; color: var(--text); }
        .login-nav > a:hover, .sioa-sound:hover { color: var(--text); }
        .sioa-motif { display: none; }

        .page {
            min-height: 100svh;
            padding: 112px 24px 46px;
            justify-content: center;
        }

        .brand {
            margin-bottom: 22px;
            animation: quietReveal 0.9s ease both;
        }

        .brand-ornament {
            display: block;
            margin-bottom: 13px;
            color: var(--saffron);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
        }

        .brand-wordmark {
            display: block;
            margin: 0 0 7px;
            color: var(--text);
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.9rem, 2.4vw, 2.45rem);
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .brand-sub {
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.16em;
        }

        .card {
            width: min(430px, 100%);
            max-width: none;
            padding: 23px 34px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: none;
            backdrop-filter: blur(5px);
            animation: quietReveal 0.9s ease 0.08s both;
        }

        @keyframes quietReveal { from { opacity: 0; } to { opacity: 1; } }

        .tabs {
            gap: 28px;
            justify-content: center;
            margin-bottom: 26px;
            padding: 0;
            background: transparent;
            border-radius: 0;
        }

        .tab {
            flex: 0 1 auto;
            padding: 9px 16px;
            color: var(--muted);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 999px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .tab.active {
            color: var(--text);
            background: rgba(95, 15, 24, 0.5);
            border: 1px solid var(--saffron);
        }

        .notice {
            gap: 11px;
            margin-bottom: 21px;
            padding: 4px 0 4px 13px;
            background: transparent;
            border: 0;
            border-left: 1px solid var(--saffron);
            border-radius: 0;
        }

        .notice svg { stroke: var(--saffron); }
        .notice-text { color: var(--muted); font-size: 0.78rem; line-height: 1.55; }
        .notice-text strong { color: var(--text); }

        .btn-google {
            min-height: 46px;
            margin-bottom: 22px;
            padding: 12px 18px;
            color: var(--text);
            background: rgba(43, 4, 7, 0.46);
            border: 1px solid var(--border-mid);
            border-radius: 999px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 0.86rem;
            box-shadow: none;
        }

        .btn-google:hover {
            color: #f8ded2;
            background: rgba(63, 7, 11, 0.62);
            border-color: rgba(226, 177, 157, 0.62);
            transform: none;
        }

        .divider { gap: 16px; margin-bottom: 22px; }
        .divider-line { background: var(--border); }
        .divider-text { color: var(--muted); font-size: 0.7rem; }
        .field { margin-bottom: 17px; }

        .field label {
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        .field input {
            min-height: 46px;
            padding: 10px 15px;
            color: var(--text);
            background: rgba(35, 3, 6, 0.42);
            border: 1px solid var(--border-mid);
            border-radius: 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.08rem;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .field input::placeholder { color: rgba(239, 208, 194, 0.35); }
        .field input:hover { background: rgba(45, 5, 8, 0.52); border-color: rgba(226, 177, 157, 0.66); }

        .field input:focus {
            background: rgba(45, 5, 8, 0.62);
            border-color: var(--saffron);
            box-shadow: none;
        }

        .btn-submit {
            min-height: 47px;
            margin-top: 10px;
            padding: 13px 18px;
            color: #260305;
            background: var(--saffron);
            border: 1px solid var(--saffron);
            border-radius: 999px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            box-shadow: none;
        }

        .btn-submit:hover {
            color: #190103;
            background: #dda47d;
            border-color: #dda47d;
            box-shadow: none;
            transform: none;
        }

        .forgot-wrap { margin-top: 15px; text-align: center; }
        .forgot {
            padding: 4px;
            color: var(--muted);
            background: none;
            border: 0;
            font: 400 0.78rem/1.4 'Noto Sans', sans-serif;
            cursor: pointer;
        }
        .forgot:hover { color: var(--text); }

        .msg {
            margin-top: 16px;
            padding: 10px 0 10px 13px;
            border: 0;
            border-left: 1px solid;
            border-radius: 12px;
            background: transparent;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .msg.error { background: transparent; border-color: var(--error); color: #efb2aa; }
        .msg.success { background: transparent; border-color: var(--saffron); color: var(--text); }
        .msg.info { background: transparent; border-color: var(--border-mid); color: var(--muted); }
        .back-link { display: none; }

        :focus-visible { outline: 1px solid var(--saffron); outline-offset: 4px; }

        @media (max-width: 720px) {
            body::before { background-position: center center; }
            .login-header { height: 72px; padding: 0 20px; }
            .site-mark { gap: 14px; font-size: 1.05rem; }
            .site-mark::after { width: 24px; }
            .login-nav > a { display: none; }
            .login-nav, .sioa-controls { gap: 13px; }
            .sioa-sound, .sioa-language { font-size: 0.64rem; }
            .page { padding: 88px 18px 32px; }
            .card { width: min(410px, 100%); padding: 22px 24px 26px; }
        }

        @media (max-height: 760px) {
            .page { justify-content: flex-start; }
            .brand { margin-bottom: 16px; }
            .brand-ornament { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<header class="login-header">
    <a class="site-mark" href="../index.html">SIOA</a>
    <nav class="login-nav" aria-label="Login utilities">
        <a href="../index.html">Back to site</a>
    </nav>
</header>

<div class="page">

    <div class="brand">
        <span class="brand-ornament" aria-hidden="true">✥</span>
        <h1 class="brand-wordmark">Member Access</h1>
        <p class="brand-sub">Society of Indian Origami Artists</p>
    </div>

    <div class="card">

        <div class="tabs">
            <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- ── LOGIN PANEL ── -->
        <div class="panel active" id="panel-login">

            <button class="btn-google" id="google-login-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                    <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">or</span>
                <div class="divider-line"></div>
            </div>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-submit" id="login-btn">Sign In</button>
            </form>
            <div class="forgot-wrap">
                <button type="button" class="forgot" onclick="sendPasswordReset(document.getElementById('login-email').value)">Forgot password?</button>
            </div>
            <div class="msg" id="login-msg"></div>
        </div>

        <!-- ── SIGNUP PANEL ── -->
        <div class="panel" id="panel-signup">

            <!-- India-only notice -->
            <div class="notice">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <p class="notice-text">
                    <strong>Indian origami artists only.</strong>
                    Profile creation is currently limited to members of the Indian origami community.
                </p>
            </div>

            <button class="btn-google" id="google-signup-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">

async function sendPasswordReset(email) {
  if (!email) {
    alert('Please enter your email in the field above.');
    return;
  }

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://sioa.art/reset-password.html'
  });

  if (error) {
    alert('Error: ' + error.message);
  } else {

    function switchTab(tab) {
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
        document.getElementById('panel-login').classList.toggle('active', tab === 'login');
        document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
    }

    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = 'msg ' + type;
    }

    function setLoading(btnId, loading, defaultText) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.innerHTML = loading
            ? `<span class="spinner"></span> Please wait…`
            : defaultText;
    }

    async function loginWithGoogle() {
        const { error } = await sb.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/dashbord/index.html' }
        });
        if (error) alert('Google sign-in failed: ' + error.message);
    }

    document.getElementById('google-login-btn').addEventListener('click', loginWithGoogle);
    document.getElementById('google-signup-btn').addEventListener('click', loginWithGoogle);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
            showMsg('login-msg', 'Please enter your email and password.', 'error');
            return;
        }

        setLoading('login-btn', true, 'Sign In');
        const { error } = await sb.auth.signInWithPassword({ email, password });
        setLoading('login-btn', false, 'Sign In');

        if (error) {
            showMsg('login-msg', error.message, 'error');
        } else {
            showMsg('login-msg', 'Signed in! Redirecting…', 'success');
            setTimeout(() => window.location.href = '/dashbord/index.html', 800);
        }
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name     = document.getElementById('signup-name').value.trim();
        const email    = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;

        if (!name || !email || !password) {
            showMsg('signup-msg', 'Please fill in all fields.', 'error');
            return;
        }
        if (password.length < 6) {
            showMsg('signup-msg', 'Password must be at least 6 characters.', 'error');
            return;
        }

        setLoading('signup-btn', true, 'Create Account');
        const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
        });
        setLoading('signup-btn', false, 'Create Account');

        if (error) {
            showMsg('signup-msg', error.message, 'error');
        } else if (data?.user?.identities?.length === 0) {
            showMsg('signup-msg', 'An account with this email already exists. Try signing in.', 'error');
        } else {
            showMsg('signup-msg', 'Account created! Check your email to confirm, then sign in.', 'success');
        }
    });
</script>
