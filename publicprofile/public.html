<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artist Archive | SIOA</title>
  <link rel="stylesheet" href="../assets/sioa-archive.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.profile-shell{min-height:100vh;display:grid;grid-template-columns:minmax(280px,.8fr) minmax(320px,1.2fr);padding:clamp(28px,6vw,92px);gap:clamp(40px,8vw,140px);align-items:end}.profile-mark{align-self:start;font:600 11px/1.2 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--sioa-saffron)}.profile-name{margin:0;font-size:clamp(64px,12vw,180px);font-weight:400;line-height:.76;letter-spacing:-.07em}.profile-meta{border-top:1px solid var(--sioa-line);padding-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sioa-muted)}.profile-piece{aspect-ratio:4/5;border:1px solid var(--sioa-line);position:relative;display:grid;place-items:center;overflow:hidden}.profile-piece::before,.profile-piece::after{content:'';position:absolute;width:56%;height:56%;border:1px solid var(--sioa-saffron);transform:rotate(45deg)}.profile-piece::after{width:28%;height:28%;transform:rotate(45deg);animation:breathe 9s ease-in-out infinite}.profile-piece span{position:absolute;bottom:18px;left:18px;font-size:10px;letter-spacing:.16em;color:var(--sioa-muted)}@keyframes breathe{50%{transform:rotate(52deg) scale(.92)}}@media(max-width:760px){.profile-shell{grid-template-columns:1fr;align-items:start}.profile-name{font-size:24vw}.profile-piece{min-height:56vh}}@media(prefers-reduced-motion:reduce){.profile-piece::after{animation:none}}
  </style>
</head>
<body>
  <main class="profile-shell">
    <section><p class="profile-mark">SIOA · ARTIST ARCHIVE</p><h1 class="profile-name">Artist<br>Archive</h1><div class="profile-meta"><span>India</span><span>Origami</span><span>Profile</span><span>2026</span></div></section>
    <div class="profile-piece" aria-label="Artist profile artwork placeholder"><span>ARCHIVE RECORD</span></div>
  </main>
  <script src="../assets/sioa-archive.js"></script>
<script src="../assets/sioa-mobile.js"></script>
</body>
</html>
