<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAGH 2026 — Judging | SIOA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14;
  --panel:#141a21;
  --panel-2:#1a212a;
  --panel-3:#212a34;
  --border:#262f39;
  --border-soft:#1d252e;
  --text:#f0f3f6;
  --muted:#9aa6b2;
  --faint:#6b7885;
  --accent:#4fa8c9;
  --accent-strong:#63b9d8;
  --green:#5ec98e;
  --amber:#e0b155;
  --red:#e07272;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -18px rgba(0,0,0,.9);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

/* ============ LOGIN GATE ============ */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-box{width:100%;max-width:390px;}
.gate-mark{
  width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--panel);display:flex;align-items:center;justify-content:center;margin-bottom:22px;
}
.gate-mark svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linejoin:round;}
.gate-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.gate-title{font-size:27px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;}
.gate-sub{font-size:14.5px;color:var(--muted);margin-bottom:30px;}
.field-label{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:block;font-weight:600;letter-spacing:.02em;}
select,textarea,input[type=number],input[type=text],input[type=search]{
  width:100%;padding:13px 15px;background:var(--panel);
  border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);font-family:'Inter',sans-serif;font-size:16px;
  outline:none;transition:border-color .15s,background .15s;
}
select:focus,textarea:focus,input:focus{border-color:var(--accent);background:var(--panel-2);}
select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa6b2' stroke-width='2' stroke-linecap='round'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:40px;}
.gate-input{margin-bottom:16px;}
.gate-btn{
  width:100%;padding:15px;background:var(--accent);
  color:#0b0f14;border:none;border-radius:10px;font-family:'Inter',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;min-height:48px;transition:background .15s;
}
.gate-btn:hover{background:var(--accent-strong);}
.gate-error{color:var(--red);font-size:13.5px;margin-top:14px;min-height:16px;}

/* ============ TOPBAR ============ */
#dashboard{display:none;}
.topbar{
  position:sticky;top:0;z-index:100;background:rgba(11,15,20,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1500px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
}
.topbar-title{font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;}
.topbar-title span{color:var(--faint);font-weight:500;}
.dot-sep{width:4px;height:4px;border-radius:50%;background:var(--border);}
.topbar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.progress-pill{
  font-size:12.5px;color:var(--accent);font-weight:700;background:rgba(79,168,201,.11);
  padding:6px 12px;border-radius:100px;letter-spacing:.02em;
}
.judge-pill{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);}
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--panel-3);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
  border:1px solid var(--border);
}
.judge-pill b{color:var(--text);font-weight:600;}
.logout-link{font-size:13.5px;color:var(--faint);cursor:pointer;padding:8px 2px;background:none;border:none;font-family:inherit;}
.logout-link:hover{color:var(--text);}
.progress-track{height:2px;background:var(--border-soft);}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .35s ease;}

/* ============ TOOLBAR ============ */
.toolbar{
  max-width:1500px;margin:0 auto;padding:20px 20px 0;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.filters{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;}
.filter-btn{
  border:none;background:none;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;
  padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.filter-btn:hover{color:var(--text);}
.filter-btn.active{background:var(--panel-3);color:var(--text);}
.filter-btn .count{color:var(--faint);font-weight:500;margin-left:5px;}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:320px;}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;}
.search-wrap input{padding:11px 14px 11px 38px;font-size:14.5px;}

.wrap{max-width:1500px;margin:0 auto;padding:22px 20px 110px;}
.state-msg{
  text-align:center;padding:90px 20px;color:var(--muted);font-size:15px;
  border:1px dashed var(--border);border-radius:14px;
}
.state-msg b{display:block;color:var(--text);font-size:16.5px;font-weight:600;margin-bottom:6px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:24px;align-items:start;}

/* ============ CARD ============ */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);
  transition:border-color .18s;
}
.card:hover{border-color:#31404e;}
.card.is-disqualified{opacity:.55;}
.card.is-scored{border-left:2px solid var(--green);}

/* photos */
.photo-wrap{position:relative;background:#050709;flex-shrink:0;}
.card-photos{display:flex;gap:2px;height:270px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
.card-photos::-webkit-scrollbar{display:none;}
.card-photos img{height:100%;width:100%;flex:0 0 100%;object-fit:contain;cursor:zoom-in;scroll-snap-align:center;background:#050709;}
.photo-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
  background:rgba(11,15,20,.72);border:1px solid var(--border);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;transition:opacity .15s;
}
.photo-wrap:hover .photo-nav{opacity:1;}
.photo-nav:focus-visible{opacity:1;}
.photo-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.photo-nav.prev{left:10px;} .photo-nav.next{right:10px;}
.photo-count{
  position:absolute;right:10px;bottom:10px;font-size:11.5px;font-weight:600;color:var(--text);
  background:rgba(11,15,20,.75);border:1px solid var(--border);border-radius:100px;padding:3px 9px;backdrop-filter:blur(4px);
}
.photo-fallback{
  height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  color:var(--faint);font-size:13px;background:#10151b;text-align:center;padding:0 30px;line-height:1.5;
}
.photo-fallback svg{width:26px;height:26px;stroke:var(--faint);fill:none;stroke-width:1.5;opacity:.7;}

.card-body{padding:22px;display:flex;flex-direction:column;gap:18px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.entry-tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;font-weight:700;}
.model-name{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.015em;}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:100px;white-space:nowrap;letter-spacing:.02em;}
.badge.done{color:var(--green);background:rgba(94,201,142,.13);}
.badge.flagged{color:var(--amber);background:rgba(224,177,85,.13);}
.badge.disqualified{color:var(--red);background:rgba(224,114,114,.13);}

.meta-grid{display:flex;flex-wrap:wrap;gap:6px 8px;}
.meta-chip{
  font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border-soft);
  border-radius:7px;padding:5px 10px;
}
.meta-chip b{color:var(--faint);font-weight:600;margin-right:5px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}

.statement{font-size:13.5px;color:var(--muted);line-height:1.6;padding:13px 15px;background:var(--panel-2);border-radius:10px;border-left:2px solid var(--border);}

/* ============ SCORE ENTRY ============ */
.section{border-top:1px solid var(--border-soft);padding-top:18px;}
.section-title{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:14px;}
.section-title.admin-title{color:var(--amber);}

.crit{padding:14px 0;border-bottom:1px solid var(--border-soft);}
.crit:first-child{padding-top:2px;}
.crit:last-of-type{border-bottom:none;padding-bottom:4px;}
.crit-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
.crit-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
.weight-tag{
  font-size:10.5px;font-weight:700;color:var(--accent);background:rgba(79,168,201,.11);
  padding:2px 7px;border-radius:5px;letter-spacing:.03em;
}
.stepper{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.step-btn{
  width:36px;height:36px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--panel-2);color:var(--muted);font-size:18px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  user-select:none;font-family:inherit;transition:.12s;
}
.step-btn:hover{color:var(--text);border-color:var(--accent);}
.step-btn:active{background:var(--accent);border-color:var(--accent);color:#0b0f14;}
.crit input[type=number]{
  width:70px;text-align:center;font-size:16px;font-weight:700;padding:8px 4px;
  font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:100px;
  background:var(--panel-3);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--accent);
  border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:var(--accent);
  border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);cursor:grab;
}
.crit-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:7px;}
.crit-foot .contrib{color:var(--muted);font-weight:600;}

.total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:var(--panel-2);border-radius:11px;margin-top:14px;border:1px solid var(--border-soft);
}
.total-label{font-size:11.5px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.total-val{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.total-val small{font-size:14px;color:var(--faint);font-weight:600;}

textarea.comments{min-height:62px;resize:vertical;font-size:14.5px;margin-top:14px;line-height:1.5;}

.save-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
.save-btn{
  flex:1;padding:14px;background:var(--accent);color:#0b0f14;border:none;border-radius:10px;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;min-height:48px;transition:.15s;
}
.save-btn:hover:not(:disabled){background:var(--accent-strong);}
.save-btn:disabled{opacity:.45;cursor:default;}
.save-btn.is-dirty{box-shadow:0 0 0 3px rgba(79,168,201,.16);}
.save-status{font-size:12.5px;min-height:15px;color:var(--green);white-space:nowrap;font-weight:600;}

/* ============ OTHER JUDGES ============ */
.other-score-row{
  display:flex;flex-direction:column;gap:3px;padding:10px 0;
  border-bottom:1px solid var(--border-soft);font-size:14px;color:var(--muted);
}
.other-score-row:last-child{border-bottom:none;padding-bottom:0;}
.other-line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;}
.other-line b{color:var(--text);font-weight:600;}
.other-line .num{color:var(--accent);font-weight:700;font-family:'JetBrains Mono',monospace;}
.other-score-row .comment{color:var(--faint);font-style:italic;font-size:13px;line-height:1.5;}
.other-empty{font-size:13.5px;color:var(--faint);}

/* ============ ADMIN ============ */
.admin-panel{border:1px solid rgba(224,177,85,.28);border-radius:12px;padding:16px;background:rgba(224,177,85,.035);}
.admin-toggles{display:flex;gap:10px;margin-bottom:12px;}
.admin-toggle{
  flex:1;padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;text-align:center;cursor:pointer;
  border:1.5px solid var(--border);background:var(--panel-2);color:var(--muted);min-height:44px;
  display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;transition:.15s;
}
.admin-toggle:hover{color:var(--text);}
.admin-toggle.active-flag{background:rgba(224,177,85,.16);border-color:var(--amber);color:var(--amber);}
.admin-toggle.active-dq{background:rgba(224,114,114,.16);border-color:var(--red);color:var(--red);}
.admin-reason{min-height:50px;font-size:14px;margin-bottom:12px;}
.admin-save{
  width:100%;padding:12px;background:transparent;border:1.5px solid rgba(224,177,85,.5);color:var(--amber);
  border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit;transition:.15s;
}
.admin-save:hover{background:rgba(224,177,85,.1);border-color:var(--amber);}
.admin-note{font-size:12px;color:var(--faint);margin-top:9px;line-height:1.5;}

/* ============ LIGHTBOX ============ */
.lightbox{
  position:fixed;inset:0;z-index:400;background:rgba(5,7,9,.94);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:32px;
}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;}
.lightbox-close{
  position:absolute;top:20px;right:20px;width:42px;height:42px;border-radius:50%;
  background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;
  font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;
}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important;}}

@media(max-width:560px){
  body{font-size:15px;}
  .wrap{padding:18px 14px 80px;}
  .toolbar{padding:16px 14px 0;}
  .grid{grid-template-columns:1fr;gap:20px;}
  .card-body{padding:18px;}
  .model-name{font-size:19px;}
  .topbar-inner{padding:12px 14px;}
  .search-wrap{max-width:none;}
  .card-photos{height:230px;}
  .photo-nav{opacity:1;}
}
</style>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12Z"/><path d="M12 2v20M2 12h20"/></svg>
    </div>
    <p class="gate-eyebrow">SIOA · Private</p>
    <h1 class="gate-title">VAGH 2026 Judging</h1>
    <p class="gate-sub">Pick your name to open the scoring panel.</p>
    <label class="field-label" for="judgeSelect">Your name</label>
    <select class="gate-input" id="judgeSelect">
      <option value="">Select…</option>
      <option value="Boice">Boice</option>
      <option value="Sampreet">Sampreet</option>
      <option value="Nara">Nara</option>
    </select>
    <button class="gate-btn" id="enterBtn">Open panel</button>
    <p class="gate-error" id="gateError"></p>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-title">VAGH 2026 <span class="dot-sep"></span> <span>Judging</span></div>
      <div class="topbar-right">
        <span class="progress-pill mono" id="progressPill">0 / 0</span>
        <span class="judge-pill"><span class="avatar" id="judgeAvatar"></span>Judging as <b id="currentJudgeLabel"></b></span>
        <button class="logout-link" id="logoutBtn">Log out</button>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All <span class="count" id="count-all"></span></button>
      <button class="filter-btn" data-filter="todo">To score <span class="count" id="count-todo"></span></button>
      <button class="filter-btn" data-filter="done">Scored <span class="count" id="count-done"></span></button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="Search model, folder, entry #">
    </div>
  </div>

  <div class="wrap">
    <div class="state-msg" id="stateMsg">Loading submissions…</div>
    <div class="grid" id="grid" style="display:none;"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close image">×</button>
  <img id="lightboxImg" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const sb = window.supabase.createClient(
  "https://zbgvgzzaejaxrgcjjovc.supabase.co",
  "sb_publishable_gCLTB6WM95Iw6Txcf2fjCA_5fnXPw77"
);
const IMAGE_BUCKET = "competition_media";

// Three criteria only. Weights are percentages and must sum to 100.
const CRITERIA = [
  { key: "precision",         col: "precision_score",   label: "Precision",         weight: 20 },
  { key: "shaping",           col: "shaping",           label: "Shaping",           weight: 45 },
  { key: "overall_execution", col: "overall_execution", label: "Overall Execution", weight: 35 },
];

let CURRENT_JUDGE = null;
let submissions = [];
let allScores = [];
let allFlags = [];
let FILTER = 'all';
let QUERY = '';

// ============================================================
// GATE
// ============================================================
const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const gateError = document.getElementById('gateError');

function selectJudge(judge) {
  CURRENT_JUDGE = judge;
  sessionStorage.setItem('vagh_judge_name', judge);
}

document.getElementById('enterBtn').addEventListener('click', () => {
  const judge = document.getElementById('judgeSelect').value;
  if (!judge) { gateError.textContent = 'Pick your name to continue.'; return; }
  selectJudge(judge);
  enterDashboard();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('vagh_judge_name');
  location.reload();
});

(function autoResume() {
  const judge = sessionStorage.getItem('vagh_judge_name');
  if (judge) { selectJudge(judge); enterDashboard(); }
})();

function enterDashboard() {
  gate.style.display = 'none';
  dashboard.style.display = 'block';
  document.getElementById('currentJudgeLabel').textContent = CURRENT_JUDGE;
  document.getElementById('judgeAvatar').textContent = CURRENT_JUDGE.charAt(0).toUpperCase();
  loadData();
}

// ============================================================
// DATA
// ============================================================
function imgUrl(path) {
  if (!path) return null;
  if (path.startsWith('http')) return path;
  return sb.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

async function loadData() {
  const stateMsg = document.getElementById('stateMsg');
  const grid = document.getElementById('grid');
  stateMsg.style.display = 'block';
  stateMsg.innerHTML = 'Loading submissions…';
  grid.style.display = 'none';

  const [subsRes, scoresRes, flagsRes] = await Promise.all([
    sb.rpc('judging_get_submissions'),
    sb.rpc('judging_get_scores'),
    sb.rpc('judging_get_flags'),
  ]);

  if (subsRes.error) {
    stateMsg.innerHTML = '<b>Submissions did not load</b>' + escapeHtml(subsRes.error.message) + ' — reload the page, or check that judging_get_submissions is exposed.';
    return;
  }
  submissions = subsRes.data || [];
  allScores = scoresRes.data || [];
  allFlags = flagsRes.data || [];

  if (submissions.length === 0) {
    stateMsg.innerHTML = '<b>Nothing to judge yet</b>Submissions will appear here as they come in.';
    return;
  }

  document.getElementById('toolbar').style.display = 'flex';
  renderGrid();
}

function scoresFor(id) { return allScores.filter(s => s.submission_id === id); }
function flagFor(id) { return allFlags.find(f => f.submission_id === id) || null; }
function myScoreFor(id) { return scoresFor(id).find(s => s.judge_name === CURRENT_JUDGE) || null; }

// Only Nara sees flagged / disqualified entries.
function visibleSubmissions() {
  if (CURRENT_JUDGE === 'Nara') return submissions;
  return submissions.filter(s => {
    const f = flagFor(s.id);
    return !(f && (f.flagged || f.disqualified));
  });
}

function filteredSubmissions() {
  const q = QUERY.trim().toLowerCase();
  return visibleSubmissions().filter(s => {
    const scored = !!myScoreFor(s.id);
    if (FILTER === 'todo' && scored) return false;
    if (FILTER === 'done' && !scored) return false;
    if (!q) return true;
    return [s.model_name, s.artist_name, s.designer, s.submission_id, s.entry_number]
      .filter(Boolean).join(' ').toLowerCase().includes(q);
  });
}

function updateProgress() {
  const visible = visibleSubmissions();
  const done = visible.filter(s => myScoreFor(s.id)).length;
  document.getElementById('progressPill').textContent = `${done} / ${visible.length} scored`;
  document.getElementById('progressFill').style.width =
    visible.length ? (done / visible.length * 100) + '%' : '0%';
  document.getElementById('count-all').textContent = visible.length;
  document.getElementById('count-todo').textContent = visible.length - done;
  document.getElementById('count-done').textContent = done;
}

document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    FILTER = b.dataset.filter;
    renderGrid();
  });
});
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { QUERY = e.target.value; renderGrid(); }, 140);
});

function renderGrid() {
  updateProgress();
  const grid = document.getElementById('grid');
  const stateMsg = document.getElementById('stateMsg');
  const list = filteredSubmissions();
  grid.innerHTML = '';

  if (list.length === 0) {
    grid.style.display = 'none';
    stateMsg.style.display = 'block';
    stateMsg.innerHTML = FILTER === 'todo'
      ? '<b>All caught up</b>Every visible entry has your score on it.'
      : '<b>No matches</b>Try a different name, folder, or entry number.';
    return;
  }
  stateMsg.style.display = 'none';
  grid.style.display = 'grid';
  list.forEach(sub => grid.appendChild(renderCard(sub)));
}

// ============================================================
// SCORING MATH — weighted total out of 100
// weights sum to 100, scores are 1–10  =>  Σ(score × weight) / 10
// ============================================================
function clampVal(v) {
  v = parseFloat(v);
  if (isNaN(v)) return 5;
  return Math.round(Math.min(10, Math.max(1, v)) * 100) / 100;
}
function weightedTotalFromValues(values) {
  const total = CRITERIA.reduce((sum, c) => sum + (values[c.key] || 0) * c.weight, 0);
  return (total / 10).toFixed(2);
}
function totalOf(scoreRow) {
  const v = {};
  CRITERIA.forEach(c => { v[c.key] = parseFloat(scoreRow[c.col]) || 0; });
  return weightedTotalFromValues(v);
}

const brokenImageIcon = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;

function renderCard(sub) {
  const card = document.createElement('div');
  const myScore = myScoreFor(sub.id);
  const flag = flagFor(sub.id);
  const isAdmin = CURRENT_JUDGE === 'Nara';

  card.className = 'card' + (myScore ? ' is-scored' : '') + (flag && flag.disqualified ? ' is-disqualified' : '');

  // ---- photos
  const paths = sub.image_paths || [];
  let photosHtml;
  if (paths.length === 0) {
    photosHtml = `<div class="photo-fallback">${brokenImageIcon}No photo attached to this entry</div>`;
  } else {
    photosHtml = `
      <div class="photo-wrap">
        <div class="card-photos" id="strip-${sub.id}">
          ${paths.map((p, i) => `<img src="${imgUrl(p)}" loading="lazy" alt="Entry photo ${i + 1}" data-full="${imgUrl(p)}" onerror="handleImgError(this)">`).join('')}
        </div>
        ${paths.length > 1 ? `
          <button class="photo-nav prev" data-dir="-1" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="photo-nav next" data-dir="1" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
          <span class="photo-count mono" id="pc-${sub.id}">1 / ${paths.length}</span>` : ''}
      </div>`;
  }

  // ---- badges
  let badges = '';
  if (myScore) badges += '<span class="badge done">Scored</span>';
  if (isAdmin && flag && flag.disqualified) badges += '<span class="badge disqualified">Disqualified</span>';
  else if (isAdmin && flag && flag.flagged) badges += '<span class="badge flagged">Flagged</span>';

  // ---- meta chips
  const chips = [];
  if (sub.artist_name) chips.push(`<span class="meta-chip"><b>Folder</b>${escapeHtml(sub.artist_name)}</span>`);
  if (sub.designer) chips.push(`<span class="meta-chip"><b>Designer</b>${escapeHtml(sub.designer)}</span>`);
  if (sub.paper_used) chips.push(`<span class="meta-chip"><b>Paper</b>${escapeHtml(sub.paper_used)}</span>`);
  if (sub.difficulty) chips.push(`<span class="meta-chip"><b>Difficulty</b>${escapeHtml(sub.difficulty)}</span>`);
  if (sub.time_taken) chips.push(`<span class="meta-chip"><b>Time</b>${escapeHtml(sub.time_taken)}</span>`);

  // ---- other judges
  const others = scoresFor(sub.id).filter(s => s.judge_name !== CURRENT_JUDGE);
  const othersHtml = `
    <div class="section">
      <div class="section-title">Other judges · view only</div>
      ${others.length ? others.map(o => `
        <div class="other-score-row">
          <span class="other-line"><b>${escapeHtml(o.judge_name)}</b><span class="num">${totalOf(o)} / 100</span></span>
          ${o.comments ? `<span class="comment">${escapeHtml(o.comments)}</span>` : ''}
        </div>`).join('') : '<div class="other-empty">No other scores in yet.</div>'}
    </div>`;

  const adminPanelHtml = isAdmin ? `
    <div class="section">
      <div class="section-title admin-title">Admin · flag or disqualify</div>
      <div class="admin-panel">
        <div class="admin-toggles">
          <button class="admin-toggle${flag && flag.flagged ? ' active-flag' : ''}" id="toggle-flag-${sub.id}" data-active="${flag && flag.flagged ? '1' : '0'}">Flagged</button>
          <button class="admin-toggle${flag && flag.disqualified ? ' active-dq' : ''}" id="toggle-dq-${sub.id}" data-active="${flag && flag.disqualified ? '1' : '0'}">Disqualified</button>
        </div>
        <textarea class="admin-reason" id="reason-${sub.id}" placeholder="Reason — kept on the record for this entry">${flag ? escapeHtml(flag.reason || '') : ''}</textarea>
        <button class="admin-save" id="save-flag-${sub.id}">Save flag status</button>
        <div class="save-status" id="flag-status-${sub.id}"></div>
        <p class="admin-note">Flagged and disqualified entries drop out of Boice's and Sampreet's lists straight away.</p>
      </div>
    </div>` : '';

  const initial = {};
  CRITERIA.forEach(c => { initial[c.key] = myScore ? parseFloat(myScore[c.col]) : 5; });

  card.innerHTML = `
    ${photosHtml}
    <div class="card-body">
      <div class="card-head">
        <div>
          <div class="entry-tag">${escapeHtml(sub.submission_id || '')}${sub.entry_number ? ' · #' + sub.entry_number : ''}</div>
          <div class="model-name">${escapeHtml(sub.model_name || 'Untitled')}</div>
        </div>
        <div class="badge-row">${badges}</div>
      </div>
      ${chips.length ? `<div class="meta-grid">${chips.join('')}</div>` : ''}
      ${sub.artistic_statement ? `<div class="statement">${escapeHtml(sub.artistic_statement)}</div>` : ''}

      <div class="section">
        <div class="section-title">Your score</div>
        ${CRITERIA.map(c => `
          <div class="crit">
            <div class="crit-top">
              <span class="crit-name">${c.label}<span class="weight-tag">${c.weight}%</span></span>
              <span class="stepper">
                <button class="step-btn" data-dir="-1" data-key="${c.key}" aria-label="Decrease ${c.label}">−</button>
                <input type="number" min="1" max="10" step="0.01" value="${initial[c.key].toFixed(2)}"
                       id="${c.key}-${sub.id}" data-key="${c.key}" aria-label="${c.label} score">
                <button class="step-btn" data-dir="1" data-key="${c.key}" aria-label="Increase ${c.label}">+</button>
              </span>
            </div>
            <input type="range" min="1" max="10" step="0.05" value="${initial[c.key]}" id="range-${c.key}-${sub.id}" data-key="${c.key}" aria-label="${c.label} slider">
            <div class="crit-foot">
              <span>1 — 10</span>
              <span class="contrib mono" id="contrib-${c.key}-${sub.id}">${(initial[c.key] * c.weight / 10).toFixed(2)} pts</span>
            </div>
          </div>`).join('')}

        <div class="total-row">
          <span class="total-label">Weighted total</span>
          <span class="total-val mono" id="total-${sub.id}">${weightedTotalFromValues(initial)}<small> / 100</small></span>
        </div>

        <textarea class="comments" id="comments-${sub.id}" placeholder="Notes for the record — optional">${myScore ? escapeHtml(myScore.comments || '') : ''}</textarea>
        <div class="save-row">
          <button class="save-btn" id="save-${sub.id}">${myScore ? 'Update score' : 'Save score'}</button>
          <span class="save-status" id="status-${sub.id}"></span>
        </div>
      </div>

      ${othersHtml}
      ${adminPanelHtml}
    </div>`;

  // ---- live totals
  const markDirty = () => {
    const btn = card.querySelector(`#save-${sub.id}`);
    btn.classList.add('is-dirty');
    card.querySelector(`#status-${sub.id}`).textContent = '';
  };
  const recalc = () => {
    const values = {};
    CRITERIA.forEach(c => {
      const v = parseFloat(card.querySelector(`#${c.key}-${sub.id}`).value) || 0;
      values[c.key] = v;
      card.querySelector(`#contrib-${c.key}-${sub.id}`).textContent = (v * c.weight / 10).toFixed(2) + ' pts';
    });
    card.querySelector(`#total-${sub.id}`).innerHTML = `${weightedTotalFromValues(values)}<small> / 100</small>`;
  };

  CRITERIA.forEach(c => {
    const num = card.querySelector(`#${c.key}-${sub.id}`);
    const range = card.querySelector(`#range-${c.key}-${sub.id}`);
    num.addEventListener('input', () => { range.value = num.value; recalc(); markDirty(); });
    num.addEventListener('blur', () => { num.value = clampVal(num.value).toFixed(2); range.value = num.value; recalc(); });
    range.addEventListener('input', () => { num.value = clampVal(range.value).toFixed(2); recalc(); markDirty(); });
  });

  card.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = card.querySelector(`#${btn.dataset.key}-${sub.id}`);
      num.value = clampVal(parseFloat(num.value) + parseFloat(btn.dataset.dir) * 0.5).toFixed(2);
      num.dispatchEvent(new Event('input'));
    });
  });

  card.querySelector(`#comments-${sub.id}`).addEventListener('input', markDirty);
  card.querySelector(`#save-${sub.id}`).addEventListener('click', () => saveScore(sub.id, card));

  // ---- photo carousel + lightbox
  const strip = card.querySelector(`#strip-${sub.id}`);
  if (strip) {
    strip.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', () => openLightbox(img.dataset.full));
    });
    card.querySelectorAll('.photo-nav').forEach(nav => {
      nav.addEventListener('click', () => {
        strip.scrollBy({ left: parseInt(nav.dataset.dir) * strip.clientWidth, behavior: 'smooth' });
      });
    });
    const counter = card.querySelector(`#pc-${sub.id}`);
    if (counter) {
      strip.addEventListener('scroll', () => {
        const i = Math.round(strip.scrollLeft / strip.clientWidth) + 1;
        counter.textContent = `${Math.min(i, paths.length)} / ${paths.length}`;
      }, { passive: true });
    }
  }

  if (isAdmin) {
    const flagToggle = card.querySelector(`#toggle-flag-${sub.id}`);
    const dqToggle = card.querySelector(`#toggle-dq-${sub.id}`);
    flagToggle.addEventListener('click', () => {
      const active = flagToggle.dataset.active === '1';
      flagToggle.dataset.active = active ? '0' : '1';
      flagToggle.classList.toggle('active-flag', !active);
    });
    dqToggle.addEventListener('click', () => {
      const active = dqToggle.dataset.active === '1';
      dqToggle.dataset.active = active ? '0' : '1';
      dqToggle.classList.toggle('active-dq', !active);
    });
    card.querySelector(`#save-flag-${sub.id}`).addEventListener('click', () => saveFlag(sub.id, card));
  }

  return card;
}

// ============================================================
// LIGHTBOX
// ============================================================
const lightbox = document.getElementById('lightbox');
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  lightbox.classList.add('open');
}
function closeLightbox() { lightbox.classList.remove('open'); }
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function handleImgError(imgEl) {
  const container = imgEl.closest('.photo-wrap');
  if (container && !container.dataset.fallbackShown) {
    container.dataset.fallbackShown = '1';
    container.outerHTML = `<div class="photo-fallback">${brokenImageIcon}Photo did not load — check that IMAGE_BUCKET matches a public bucket in Supabase Storage</div>`;
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

// ============================================================
// SAVE
// ============================================================
async function saveScore(subId, card) {
  const btn = card.querySelector(`#save-${subId}`);
  const status = card.querySelector(`#status-${subId}`);
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Saving…'; status.textContent = '';

  const get = key => clampVal(card.querySelector(`#${key}-${subId}`).value);
  const comments = card.querySelector(`#comments-${subId}`).value.trim();

  const { data, error } = await sb.rpc('judging_submit_score', {
    p_submission_id: subId,
    p_judge_name: CURRENT_JUDGE,
    p_precision: get('precision'),
    p_shaping: get('shaping'),
    p_overall_execution: get('overall_execution'),
    p_comments: comments,
  });

  btn.disabled = false; btn.textContent = label;

  if (error) {
    status.style.color = 'var(--red)';
    status.textContent = error.message;
    console.error('judging_submit_score error:', error);
    return;
  }

  allScores = allScores.filter(s => !(s.submission_id === subId && s.judge_name === CURRENT_JUDGE));
  allScores.push(data);
  status.style.color = 'var(--green)';
  status.textContent = 'Saved';
  btn.classList.remove('is-dirty');
  btn.textContent = 'Update score';
  card.classList.add('is-scored');
  updateProgress();
  if (!card.querySelector('.badge.done')) {
    const badge = document.createElement('span');
    badge.className = 'badge done';
    badge.textContent = 'Scored';
    card.querySelector('.badge-row').prepend(badge);
  }
}

async function saveFlag(subId, card) {
  const btn = card.querySelector(`#save-flag-${subId}`);
  const status = card.querySelector(`#flag-status-${subId}`);
  btn.disabled = true; btn.textContent = 'Saving…'; status.textContent = '';

  const flagged = card.querySelector(`#toggle-flag-${subId}`).dataset.active === '1';
  const disqualified = card.querySelector(`#toggle-dq-${subId}`).dataset.active === '1';
  const reason = card.querySelector(`#reason-${subId}`).value.trim();

  const { data, error } = await sb.rpc('judging_set_flag', {
    p_submission_id: subId,
    p_judge_name: CURRENT_JUDGE,
    p_flagged: flagged,
    p_disqualified: disqualified,
    p_reason: reason,
  });

  btn.disabled = false; btn.textContent = 'Save flag status';

  if (error) {
    status.style.color = 'var(--red)';
    status.textContent = error.message;
    console.error('judging_set_flag error:', error);
    return;
  }

  allFlags = allFlags.filter(f => f.submission_id !== subId);
  allFlags.push(data);
  renderGrid();
}
</script>
