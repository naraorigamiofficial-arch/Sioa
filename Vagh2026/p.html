<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAGH 2026 — Judging | SIOA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --deep-blue:#0a1628;
  --navy-blue:#0f2847;
  --cyan-blue:#1a5f7a;
  --bright-cyan:#2d89b0;
  --metallic-blue:#4a90a4;
  --light-cyan:#57a6bb;
  --white:#e8f4f8;
  --light-grey:#c5d9e0;
  --gold:#c8963a;
  --silver:#8090a4;
  --bronze:#a06030;
  --green:#4cc990;
  --red:#e06060;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--black);
  color:var(--white);
  min-height:100vh;
}

/* ============ LOGIN GATE ============ */
.gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.gate-box{
  width:100%;max-width:380px;text-align:center;
  padding:44px 36px;border:1px solid rgba(26,95,122,0.35);
  border-radius:14px;background:linear-gradient(135deg,rgba(10,22,40,0.9),rgba(15,40,71,0.6));
}
.gate-eyebrow{font-size:10px;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;color:var(--bright-cyan);margin-bottom:12px;}
.gate-title{font-size:26px;font-weight:800;margin-bottom:8px;}
.gate-sub{font-size:13px;color:var(--light-grey);font-weight:300;margin-bottom:30px;line-height:1.6;}
.gate-input, select, textarea, input[type=number]{
  width:100%;padding:13px 16px;background:rgba(0,0,0,0.4);
  border:1px solid rgba(26,95,122,0.4);border-radius:6px;
  color:var(--white);font-family:'Inter',sans-serif;font-size:14px;
  outline:none;transition:border-color 0.25s;
}
.gate-input:focus, select:focus, textarea:focus, input[type=number]:focus{border-color:var(--bright-cyan);}
.gate-input{margin-bottom:14px;}
.gate-select{margin-bottom:20px;}
.gate-btn{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--cyan-blue),var(--bright-cyan));
  color:var(--white);border:none;border-radius:6px;font-family:'Inter',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;transition:all 0.25s;
}
.gate-btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(45,137,176,0.3);}
.gate-error{color:var(--red);font-size:12px;margin-top:14px;min-height:16px;}

/* ============ DASHBOARD ============ */
#dashboard{display:none;}
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(26,95,122,0.25);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.topbar-title{font-size:15px;font-weight:800;letter-spacing:0.06em;}
.topbar-title span{color:var(--bright-cyan);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.judge-pill{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--light-grey);
}
.judge-pill select{width:auto;padding:7px 12px;font-size:12px;}
.progress-pill{font-size:11px;color:var(--bright-cyan);letter-spacing:0.05em;}
.logout-link{font-size:11px;color:rgba(197,217,224,0.4);cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;}
.logout-link:hover{color:var(--white);}

.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 100px;}
.state-msg{text-align:center;padding:60px 20px;color:var(--light-grey);font-size:14px;font-weight:300;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;}

.card{
  border:1px solid rgba(26,95,122,0.25);border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,rgba(10,22,40,0.75),rgba(15,40,71,0.4));
  display:flex;flex-direction:column;
}
.card.done{border-color:rgba(76,201,144,0.35);}

.card-photos{display:flex;gap:2px;height:200px;overflow-x:auto;background:#050b14;}
.card-photos img{height:100%;width:auto;flex-shrink:0;object-fit:cover;cursor:pointer;}
.card-photos.single img{width:100%;object-fit:contain;}
.no-photo{height:200px;display:flex;align-items:center;justify-content:center;color:rgba(197,217,224,0.25);font-size:12px;}

.card-body{padding:20px 22px;flex:1;display:flex;flex-direction:column;gap:14px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.entry-tag{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--bright-cyan);margin-bottom:4px;}
.model-name{font-size:18px;font-weight:700;line-height:1.25;}
.done-badge{
  flex-shrink:0;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--green);background:rgba(76,201,144,0.12);border:1px solid rgba(76,201,144,0.3);
  padding:4px 9px;border-radius:100px;white-space:nowrap;
}
.meta-row{font-size:12px;color:var(--light-grey);font-weight:300;line-height:1.7;}
.meta-row b{color:var(--white);font-weight:500;}
.statement{
  font-size:12.5px;color:var(--light-grey);font-weight:300;line-height:1.6;
  padding:10px 12px;background:rgba(45,137,176,0.06);border-left:2px solid rgba(45,137,176,0.35);
  border-radius:0 4px 4px 0;max-height:90px;overflow-y:auto;
}

.criteria{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.crit-field label{
  display:flex;justify-content:space-between;font-size:11px;color:var(--light-grey);
  letter-spacing:0.03em;margin-bottom:5px;
}
.crit-field label .val{color:var(--bright-cyan);font-weight:700;}
.crit-field input[type=range]{width:100%;accent-color:var(--bright-cyan);}

.total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:6px;border-top:1px solid rgba(26,95,122,0.2);font-size:13px;
}
.total-row b{font-size:18px;color:var(--white);}

textarea.comments{min-height:60px;resize:vertical;font-size:12.5px;}

.save-btn{
  padding:11px;background:linear-gradient(135deg,var(--cyan-blue),var(--bright-cyan));
  color:var(--white);border:none;border-radius:6px;font-family:'Inter',sans-serif;
  font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;
  transition:all 0.25s;
}
.save-btn:hover{transform:translateY(-1px);}
.save-btn:disabled{opacity:0.5;cursor:default;transform:none;}
.save-status{font-size:11px;text-align:center;min-height:14px;color:var(--green);}

.other-scores{border-top:1px solid rgba(26,95,122,0.15);padding-top:12px;display:flex;flex-direction:column;gap:8px;}
.other-scores-title{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(197,217,224,0.4);}
.other-score-row{
  font-size:11.5px;color:var(--light-grey);display:flex;justify-content:space-between;gap:10px;
  padding:6px 10px;background:rgba(255,255,255,0.02);border-radius:5px;
}
.other-score-row b{color:var(--white);}
.other-score-row .comment{display:block;margin-top:3px;color:rgba(197,217,224,0.6);font-style:italic;}
</style>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div class="gate" id="gate">
  <div class="gate-box">
    <p class="gate-eyebrow">SIOA · Private</p>
    <h1 class="gate-title">VAGH 2026 Judging</h1>
    <p class="gate-sub">Not a public page. Enter the shared judging password and select your name to continue.</p>
    <input class="gate-input" type="password" id="pwInput" placeholder="Judging password" autocomplete="off">
    <select class="gate-input gate-select" id="judgeSelect">
      <option value="">Select your name…</option>
      <option value="Boice">Boice</option>
      <option value="Sampreet">Sampreet</option>
      <option value="Nara">Nara</option>
    </select>
    <button class="gate-btn" id="enterBtn">Enter</button>
    <p class="gate-error" id="gateError"></p>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-title">VAGH 2026 <span>Judging</span></div>
    <div class="topbar-right">
      <span class="progress-pill" id="progressPill"></span>
      <div class="judge-pill">
        Judging as
        <select id="judgeSwitcher">
          <option value="Boice">Boice</option>
          <option value="Sampreet">Sampreet</option>
          <option value="Nara">Nara</option>
        </select>
      </div>
      <span class="logout-link" id="logoutBtn">Log out</span>
    </div>
  </div>
  <div class="wrap">
    <div class="state-msg" id="stateMsg">Loading submissions…</div>
    <div class="grid" id="grid" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// CONFIG — adjust these two lines if needed
// ============================================================
const sb = window.supabase.createClient(
  "https://zbgvgzzaejaxrgcjjovc.supabase.co",
  "sb_publishable_gCLTB6WM95Iw6Txcf2fjCA_5fnXPw77"
);
const IMAGE_BUCKET = "submissions"; // <-- set this to your actual storage bucket name

const CRITERIA = [
  { key: "cleanliness",       label: "Cleanliness" },
  { key: "precision",         label: "Precision" },
  { key: "shaping",           label: "Shaping" },
  { key: "presentation",      label: "Presentation" },
  { key: "folding_maturity",  label: "Folding Maturity" },
  { key: "overall_execution", label: "Overall Execution" },
];

let PASSWORD = null;
let CURRENT_JUDGE = null;
let submissions = [];
let allScores = []; // every judge's scores, all rows

// ============================================================
// AUTH GATE
// ============================================================
const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const gateError = document.getElementById('gateError');

async function tryLogin(pw, judge) {
  gateError.textContent = '';
  const { data, error } = await sb.rpc('judging_login', { pw });
  if (error || data !== true) {
    gateError.textContent = 'Incorrect password.';
    return false;
  }
  PASSWORD = pw;
  CURRENT_JUDGE = judge;
  sessionStorage.setItem('vagh_judge_pw', pw);
  sessionStorage.setItem('vagh_judge_name', judge);
  return true;
}

document.getElementById('enterBtn').addEventListener('click', async () => {
  const pw = document.getElementById('pwInput').value.trim();
  const judge = document.getElementById('judgeSelect').value;
  if (!pw) { gateError.textContent = 'Enter the password.'; return; }
  if (!judge) { gateError.textContent = 'Select your name.'; return; }
  const btn = document.getElementById('enterBtn');
  btn.disabled = true; btn.textContent = 'Checking…';
  const ok = await tryLogin(pw, judge);
  btn.disabled = false; btn.textContent = 'Enter';
  if (ok) enterDashboard();
});

document.getElementById('pwInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('enterBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('vagh_judge_pw');
  sessionStorage.removeItem('vagh_judge_name');
  location.reload();
});

document.getElementById('judgeSwitcher').addEventListener('change', (e) => {
  CURRENT_JUDGE = e.target.value;
  sessionStorage.setItem('vagh_judge_name', CURRENT_JUDGE);
  renderGrid();
});

// Auto-resume session within the same browser tab
(async function autoResume() {
  const pw = sessionStorage.getItem('vagh_judge_pw');
  const judge = sessionStorage.getItem('vagh_judge_name');
  if (pw && judge) {
    const ok = await tryLogin(pw, judge);
    if (ok) enterDashboard();
  }
})();

// ============================================================
// DASHBOARD
// ============================================================
function enterDashboard() {
  gate.style.display = 'none';
  dashboard.style.display = 'block';
  document.getElementById('judgeSwitcher').value = CURRENT_JUDGE;
  loadData();
}

function imgUrl(path) {
  if (!path) return null;
  if (path.startsWith('http')) return path;
  return sb.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

async function loadData() {
  const stateMsg = document.getElementById('stateMsg');
  const grid = document.getElementById('grid');
  stateMsg.style.display = 'block'; stateMsg.textContent = 'Loading submissions…';
  grid.style.display = 'none';

  const [subsRes, scoresRes] = await Promise.all([
    sb.rpc('judging_get_submissions', { pw: PASSWORD }),
    sb.rpc('judging_get_scores', { pw: PASSWORD }),
  ]);

  if (subsRes.error) {
    stateMsg.textContent = 'Could not load submissions: ' + subsRes.error.message;
    return;
  }
  submissions = subsRes.data || [];
  allScores = scoresRes.data || [];

  if (submissions.length === 0) {
    stateMsg.textContent = 'No submissions yet.';
    return;
  }

  stateMsg.style.display = 'none';
  grid.style.display = 'grid';
  renderGrid();
}

function scoresFor(submissionId) {
  return allScores.filter(s => s.submission_id === submissionId);
}

function updateProgress() {
  const done = submissions.filter(s =>
    scoresFor(s.id).some(sc => sc.judge_name === CURRENT_JUDGE)
  ).length;
  document.getElementById('progressPill').textContent =
    `${CURRENT_JUDGE}: ${done} / ${submissions.length} scored`;
}

function renderGrid() {
  updateProgress();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  submissions.forEach(sub => grid.appendChild(renderCard(sub)));
}

function renderCard(sub) {
  const card = document.createElement('div');
  const myScore = scoresFor(sub.id).find(s => s.judge_name === CURRENT_JUDGE);
  card.className = 'card' + (myScore ? ' done' : '');

  // photos
  const paths = sub.image_paths || [];
  let photosHtml;
  if (paths.length === 0) {
    photosHtml = `<div class="no-photo">No photo</div>`;
  } else {
    photosHtml = `<div class="card-photos${paths.length === 1 ? ' single' : ''}">` +
      paths.map(p => `<img src="${imgUrl(p)}" loading="lazy" onclick="window.open('${imgUrl(p)}','_blank')">`).join('') +
      `</div>`;
  }

  // other judges' scores
  const others = scoresFor(sub.id).filter(s => s.judge_name !== CURRENT_JUDGE);
  const othersHtml = others.length ? `
    <div class="other-scores">
      <div class="other-scores-title">Other judges</div>
      ${others.map(o => `
        <div class="other-score-row">
          <span><b>${o.judge_name}</b> — total ${totalOf(o)}/60</span>
          ${o.comments ? `<span class="comment">"${escapeHtml(o.comments)}"</span>` : ''}
        </div>
      `).join('')}
    </div>` : '';

  card.innerHTML = `
    ${photosHtml}
    <div class="card-body">
      <div class="card-head">
        <div>
          <div class="entry-tag">${sub.submission_id || ''} ${sub.entry_number ? '· #' + sub.entry_number : ''}</div>
          <div class="model-name">${escapeHtml(sub.model_name || 'Untitled')}</div>
        </div>
        ${myScore ? '<span class="done-badge">Scored</span>' : ''}
      </div>
      <div class="meta-row">
        <b>Folder:</b> ${escapeHtml(sub.artist_name || '—')}${sub.designer ? ` &nbsp;·&nbsp; <b>Designer:</b> ${escapeHtml(sub.designer)}` : ''}<br>
        ${sub.paper_used ? `<b>Paper:</b> ${escapeHtml(sub.paper_used)} &nbsp;·&nbsp; ` : ''}${sub.difficulty ? `<b>Difficulty:</b> ${escapeHtml(sub.difficulty)}` : ''}${sub.time_taken ? ` &nbsp;·&nbsp; <b>Time:</b> ${escapeHtml(sub.time_taken)}` : ''}
      </div>
      ${sub.artistic_statement ? `<div class="statement">${escapeHtml(sub.artistic_statement)}</div>` : ''}

      <div class="criteria">
        ${CRITERIA.map(c => `
          <div class="crit-field">
            <label for="${c.key}-${sub.id}">${c.label} <span class="val" id="${c.key}-${sub.id}-val">${myScore ? myScore[c.key === 'precision' ? 'precision_score' : c.key] : 5}</span></label>
            <input type="range" min="1" max="10" value="${myScore ? myScore[c.key === 'precision' ? 'precision_score' : c.key] : 5}"
                   id="${c.key}-${sub.id}" data-key="${c.key}" data-sub="${sub.id}">
          </div>
        `).join('')}
      </div>

      <div class="total-row">
        <span>Total</span>
        <b id="total-${sub.id}">${myScore ? totalOf(myScore) : 30}/60</b>
      </div>

      <textarea class="comments" id="comments-${sub.id}" placeholder="Notes / constructive feedback (optional)">${myScore ? escapeHtml(myScore.comments || '') : ''}</textarea>

      <button class="save-btn" id="save-${sub.id}">Save Score</button>
      <div class="save-status" id="status-${sub.id}"></div>

      ${othersHtml}
    </div>
  `;

  // wire up sliders
  CRITERIA.forEach(c => {
    const input = card.querySelector(`#${c.key}-${sub.id}`);
    input.addEventListener('input', () => {
      card.querySelector(`#${c.key}-${sub.id}-val`).textContent = input.value;
      const total = CRITERIA.reduce((sum, cc) =>
        sum + parseInt(card.querySelector(`#${cc.key}-${sub.id}`).value, 10), 0);
      card.querySelector(`#total-${sub.id}`).textContent = `${total}/60`;
    });
  });

  card.querySelector(`#save-${sub.id}`).addEventListener('click', () => saveScore(sub.id, card));

  return card;
}

function totalOf(scoreRow) {
  return scoreRow.cleanliness + scoreRow.precision_score + scoreRow.shaping +
         scoreRow.presentation + scoreRow.folding_maturity + scoreRow.overall_execution;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

async function saveScore(subId, card) {
  const btn = card.querySelector(`#save-${subId}`);
  const status = card.querySelector(`#status-${subId}`);
  btn.disabled = true; btn.textContent = 'Saving…'; status.textContent = '';

  const get = key => parseInt(card.querySelector(`#${key}-${subId}`).value, 10);
  const comments = card.querySelector(`#comments-${subId}`).value.trim();

  const { data, error } = await sb.rpc('judging_submit_score', {
    pw: PASSWORD,
    p_submission_id: subId,
    p_judge_name: CURRENT_JUDGE,
    p_cleanliness: get('cleanliness'),
    p_precision: get('precision'),
    p_shaping: get('shaping'),
    p_presentation: get('presentation'),
    p_folding_maturity: get('folding_maturity'),
    p_overall_execution: get('overall_execution'),
    p_comments: comments,
  });

  btn.disabled = false; btn.textContent = 'Save Score';

  if (error) {
    status.style.color = 'var(--red)';
    status.textContent = 'Error saving — try again.';
    return;
  }

  // update local cache so the card + progress reflect it immediately
  allScores = allScores.filter(s => !(s.submission_id === subId && s.judge_name === CURRENT_JUDGE));
  allScores.push(data);
  status.style.color = 'var(--green)';
  status.textContent = 'Saved.';
  updateProgress();
  card.classList.add('done');
  if (!card.querySelector('.done-badge')) {
    const badge = document.createElement('span');
    badge.className = 'done-badge';
    badge.textContent = 'Scored';
    card.querySelector('.card-head').appendChild(badge);
  }
}
</script>
</body>
</html>
