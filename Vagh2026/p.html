<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAGH 2026 — Judging | SIOA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1116;
  --panel:#12181f;
  --panel-2:#161d25;
  --border:#232c36;
  --text:#e9edf1;
  --muted:#8a97a3;
  --accent:#4fa8c9;
  --green:#5ec98e;
  --amber:#e0b155;
  --red:#e07272;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  font-size:15px;
  min-height:100vh;
}

/* ============ LOGIN GATE ============ */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-box{width:100%;max-width:360px;text-align:left;padding:40px 8px;}
.gate-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.gate-title{font-size:24px;font-weight:700;margin-bottom:10px;}
.gate-sub{font-size:13.5px;color:var(--muted);margin-bottom:28px;}
.field-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;}
.gate-input, select, textarea, input[type=number]{
  width:100%;padding:12px 14px;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'Inter',sans-serif;font-size:14.5px;
  outline:none;transition:border-color 0.2s;
}
.gate-input:focus, select:focus, textarea:focus, input[type=number]:focus{border-color:var(--accent);}
.gate-input{margin-bottom:16px;}
.gate-btn{
  width:100%;padding:13px;background:var(--accent);
  color:#0c1116;border:none;border-radius:8px;font-family:'Inter',sans-serif;
  font-size:13.5px;font-weight:700;letter-spacing:0.02em;
  cursor:pointer;margin-top:6px;
}
.gate-btn:hover{opacity:0.9;}
.gate-error{color:var(--red);font-size:13px;margin-top:14px;min-height:16px;}

/* ============ DASHBOARD ============ */
#dashboard{display:none;}
.topbar{
  position:sticky;top:0;z-index:100;background:rgba(12,17,22,0.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:18px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.topbar-title{font-size:15px;font-weight:700;}
.topbar-title span{color:var(--accent);font-weight:400;}
.topbar-right{display:flex;align-items:center;gap:20px;}
.judge-pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.judge-pill select{width:auto;padding:6px 10px;font-size:13px;}
.progress-pill{font-size:12.5px;color:var(--accent);}
.logout-link{font-size:12px;color:var(--muted);cursor:pointer;}
.logout-link:hover{color:var(--text);}

.wrap{max-width:760px;margin:0 auto;padding:48px 24px 120px;}
.state-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}

.entries{display:flex;flex-direction:column;gap:56px;}

.card{padding-bottom:8px;}
.card + .card{border-top:1px solid var(--border);padding-top:56px;}

.card-photos{display:flex;gap:8px;overflow-x:auto;margin-bottom:24px;border-radius:10px;}
.card-photos img{height:260px;width:auto;flex-shrink:0;object-fit:cover;border-radius:10px;cursor:pointer;}
.card-photos.single img{width:100%;height:320px;object-fit:contain;background:var(--panel);}
.no-photo{height:180px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--panel);border-radius:10px;margin-bottom:24px;}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;}
.entry-tag{font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.model-name{font-size:22px;font-weight:700;line-height:1.3;}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;margin-top:4px;}
.badge{font-size:11px;font-weight:600;letter-spacing:0.04em;padding:4px 10px;border-radius:100px;white-space:nowrap;}
.badge.done{color:var(--green);background:rgba(94,201,142,0.12);}
.badge.flagged{color:var(--amber);background:rgba(224,177,85,0.12);}
.badge.disqualified{color:var(--red);background:rgba(224,114,114,0.12);}
.card.is-disqualified{opacity:0.6;}

.meta-row{font-size:13.5px;color:var(--muted);margin-bottom:16px;}
.meta-row b{color:var(--text);font-weight:500;}
.statement{
  font-size:13.5px;color:var(--muted);line-height:1.65;padding:14px 16px;
  background:var(--panel);border-radius:8px;margin-bottom:24px;
}
.statement b{color:var(--text);}
.statement.warn{background:rgba(224,114,114,0.08);}

.section-label{font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}

/* Your score — manual entry */
.your-score{background:var(--panel);border-radius:12px;padding:24px;margin-bottom:20px;}
.criteria{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-bottom:20px;}
.crit-field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
.crit-field input[type=number]{text-align:center;font-size:16px;font-weight:600;padding:10px;}

.total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0 18px;border-top:1px solid var(--border);margin-top:4px;
}
.total-row span{font-size:13px;color:var(--muted);}
.total-row b{font-size:22px;color:var(--text);}

textarea.comments{min-height:56px;resize:vertical;font-size:13.5px;margin-bottom:16px;}

.save-btn{
  padding:11px 20px;background:var(--accent);color:#0c1116;border:none;border-radius:8px;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;
}
.save-btn:disabled{opacity:0.5;cursor:default;}
.save-status{font-size:12px;margin-top:8px;min-height:14px;color:var(--green);}

/* Other judges — strictly read-only, visually distinct */
.other-scores{margin-top:8px;}
.other-score-row{
  display:flex;justify-content:space-between;gap:16px;padding:12px 0;
  border-bottom:1px solid var(--border);font-size:13.5px;color:var(--muted);
}
.other-score-row:last-child{border-bottom:none;}
.other-score-row b{color:var(--text);}
.other-score-row .comment{display:block;margin-top:4px;color:var(--muted);font-style:italic;font-size:13px;}
.other-empty{font-size:13px;color:var(--muted);padding:8px 0;}

/* Admin flag panel (Nara only) */
.admin-panel{margin-top:28px;padding:20px;border:1px dashed rgba(224,177,85,0.35);border-radius:12px;}
.admin-panel-title{font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber);margin-bottom:14px;}
.admin-toggles{display:flex;gap:10px;margin-bottom:12px;}
.admin-toggle{
  flex:1;padding:9px;border-radius:8px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;
  border:1px solid var(--border);background:var(--panel-2);color:var(--muted);
}
.admin-toggle.active-flag{background:rgba(224,177,85,0.15);border-color:var(--amber);color:var(--amber);}
.admin-toggle.active-dq{background:rgba(224,114,114,0.15);border-color:var(--red);color:var(--red);}
.admin-reason{min-height:44px;font-size:13px;margin-bottom:12px;}
.admin-save{
  padding:9px 18px;background:transparent;border:1px solid var(--amber);color:var(--amber);
  border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;
}
.admin-save:hover{background:rgba(224,177,85,0.1);}

@media(max-width:520px){
  .criteria{grid-template-columns:1fr 1fr;}
  .model-name{font-size:19px;}
}
</style>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div class="gate" id="gate">
  <div class="gate-box">
    <p class="gate-eyebrow">SIOA · Private</p>
    <h1 class="gate-title">VAGH 2026 Judging</h1>
    <p class="gate-sub">Enter the shared judging password and select your name to continue.</p>
    <label class="field-label">Password</label>
    <input class="gate-input" type="password" id="pwInput" placeholder="Judging password" autocomplete="off">
    <label class="field-label">Your name</label>
    <select class="gate-input" id="judgeSelect">
      <option value="">Select…</option>
      <option value="Boice">Boice</option>
      <option value="Sampreet">Sampreet</option>
      <option value="Nara">Nara</option>
    </select>
    <button class="gate-btn" id="enterBtn">Enter</button>
    <p class="gate-error" id="gateError"></p>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-title">VAGH 2026 <span>Judging</span></div>
    <div class="topbar-right">
      <span class="progress-pill" id="progressPill"></span>
      <div class="judge-pill">
        Judging as
        <select id="judgeSwitcher">
          <option value="Boice">Boice</option>
          <option value="Sampreet">Sampreet</option>
          <option value="Nara">Nara</option>
        </select>
      </div>
      <span class="logout-link" id="logoutBtn">Log out</span>
    </div>
  </div>
  <div class="wrap">
    <div class="state-msg" id="stateMsg">Loading submissions…</div>
    <div class="entries" id="entries" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const sb = window.supabase.createClient(
  "https://zbgvgzzaejaxrgcjjovc.supabase.co",
  "sb_publishable_gCLTB6WM95Iw6Txcf2fjCA_5fnXPw77"
);
const IMAGE_BUCKET = "submissions"; // <-- set to your actual storage bucket name

const CRITERIA = [
  { key: "cleanliness",       label: "Cleanliness" },
  { key: "precision",         label: "Precision" },
  { key: "shaping",           label: "Shaping" },
  { key: "presentation",      label: "Presentation" },
  { key: "folding_maturity",  label: "Folding Maturity" },
  { key: "overall_execution", label: "Overall Execution" },
];

let PASSWORD = null;
let CURRENT_JUDGE = null;
let submissions = [];
let allScores = [];
let allFlags = [];

// ============================================================
// AUTH GATE
// ============================================================
const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const gateError = document.getElementById('gateError');

async function tryLogin(pw, judge) {
  gateError.textContent = '';
  const { data, error } = await sb.rpc('judging_login', { pw });
  if (error || data !== true) {
    gateError.textContent = 'Incorrect password.';
    return false;
  }
  PASSWORD = pw;
  CURRENT_JUDGE = judge;
  sessionStorage.setItem('vagh_judge_pw', pw);
  sessionStorage.setItem('vagh_judge_name', judge);
  return true;
}

document.getElementById('enterBtn').addEventListener('click', async () => {
  const pw = document.getElementById('pwInput').value.trim();
  const judge = document.getElementById('judgeSelect').value;
  if (!pw) { gateError.textContent = 'Enter the password.'; return; }
  if (!judge) { gateError.textContent = 'Select your name.'; return; }
  const btn = document.getElementById('enterBtn');
  btn.disabled = true; btn.textContent = 'Checking…';
  const ok = await tryLogin(pw, judge);
  btn.disabled = false; btn.textContent = 'Enter';
  if (ok) enterDashboard();
});

document.getElementById('pwInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('enterBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('vagh_judge_pw');
  sessionStorage.removeItem('vagh_judge_name');
  location.reload();
});

document.getElementById('judgeSwitcher').addEventListener('change', (e) => {
  CURRENT_JUDGE = e.target.value;
  sessionStorage.setItem('vagh_judge_name', CURRENT_JUDGE);
  renderEntries();
});

(async function autoResume() {
  const pw = sessionStorage.getItem('vagh_judge_pw');
  const judge = sessionStorage.getItem('vagh_judge_name');
  if (pw && judge) {
    const ok = await tryLogin(pw, judge);
    if (ok) enterDashboard();
  }
})();

// ============================================================
// DASHBOARD
// ============================================================
function enterDashboard() {
  gate.style.display = 'none';
  dashboard.style.display = 'block';
  document.getElementById('judgeSwitcher').value = CURRENT_JUDGE;
  loadData();
}

function imgUrl(path) {
  if (!path) return null;
  if (path.startsWith('http')) return path;
  return sb.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

async function loadData() {
  const stateMsg = document.getElementById('stateMsg');
  const entries = document.getElementById('entries');
  stateMsg.style.display = 'block'; stateMsg.textContent = 'Loading submissions…';
  entries.style.display = 'none';

  const [subsRes, scoresRes, flagsRes] = await Promise.all([
    sb.rpc('judging_get_submissions', { pw: PASSWORD }),
    sb.rpc('judging_get_scores', { pw: PASSWORD }),
    sb.rpc('judging_get_flags', { pw: PASSWORD }),
  ]);

  if (subsRes.error) {
    stateMsg.textContent = 'Could not load submissions: ' + subsRes.error.message;
    return;
  }
  submissions = subsRes.data || [];
  allScores = scoresRes.data || [];
  allFlags = flagsRes.data || [];

  if (submissions.length === 0) {
    stateMsg.textContent = 'No submissions yet.';
    return;
  }

  stateMsg.style.display = 'none';
  entries.style.display = 'flex';
  renderEntries();
}

function scoresFor(submissionId) {
  return allScores.filter(s => s.submission_id === submissionId);
}
function flagFor(submissionId) {
  return allFlags.find(f => f.submission_id === submissionId) || null;
}

function updateProgress() {
  const done = submissions.filter(s =>
    scoresFor(s.id).some(sc => sc.judge_name === CURRENT_JUDGE)
  ).length;
  document.getElementById('progressPill').textContent =
    `${CURRENT_JUDGE}: ${done} / ${submissions.length} scored`;
}

function renderEntries() {
  updateProgress();
  const entries = document.getElementById('entries');
  entries.innerHTML = '';
  submissions.forEach(sub => entries.appendChild(renderCard(sub)));
}

function clampVal(v) {
  v = parseFloat(v);
  if (isNaN(v)) return 5.0;
  if (v < 1) v = 1;
  if (v > 10) v = 10;
  return Math.round(v * 10) / 10;
}

function renderCard(sub) {
  const card = document.createElement('div');
  const myScore = scoresFor(sub.id).find(s => s.judge_name === CURRENT_JUDGE);
  const flag = flagFor(sub.id);
  const isAdmin = CURRENT_JUDGE === 'Nara';

  let classes = 'card';
  if (flag && flag.disqualified) classes += ' is-disqualified';
  card.className = classes;

  // photos
  const paths = sub.image_paths || [];
  let photosHtml;
  if (paths.length === 0) {
    photosHtml = `<div class="no-photo">No photo</div>`;
  } else {
    photosHtml = `<div class="card-photos${paths.length === 1 ? ' single' : ''}">` +
      paths.map(p => `<img src="${imgUrl(p)}" loading="lazy" onclick="window.open('${imgUrl(p)}','_blank')">`).join('') +
      `</div>`;
  }

  // badges
  let badges = '';
  if (myScore) badges += '<span class="badge done">Scored</span>';
  if (flag && flag.disqualified) badges += '<span class="badge disqualified">Disqualified</span>';
  else if (flag && flag.flagged) badges += '<span class="badge flagged">Flagged</span>';

  // ---- OTHER JUDGES: read-only, no inputs of any kind ----
  const others = scoresFor(sub.id).filter(s => s.judge_name !== CURRENT_JUDGE);
  const othersHtml = `
    <div class="other-scores">
      <div class="section-label">Other Judges — view only</div>
      ${others.length ? others.map(o => `
        <div class="other-score-row">
          <span><b>${o.judge_name}</b> — total ${totalOf(o)} / 60</span>
          ${o.comments ? `<span class="comment">"${escapeHtml(o.comments)}"</span>` : ''}
        </div>
      `).join('') : '<div class="other-empty">No other scores submitted yet.</div>'}
    </div>`;

  const reasonVisible = flag && (flag.flagged || flag.disqualified) && flag.reason;
  const flagNoteHtml = (!isAdmin && reasonVisible) ? `
    <div class="statement warn">
      <b>${flag.disqualified ? 'Disqualified' : 'Flagged'} by ${escapeHtml(flag.updated_by || 'Nara')}:</b> ${escapeHtml(flag.reason)}
    </div>` : '';

  const adminPanelHtml = isAdmin ? `
    <div class="admin-panel">
      <div class="admin-panel-title">Admin — flag / disqualify</div>
      <div class="admin-toggles">
        <div class="admin-toggle${flag && flag.flagged ? ' active-flag' : ''}" id="toggle-flag-${sub.id}" data-active="${flag && flag.flagged ? '1' : '0'}">Flagged</div>
        <div class="admin-toggle${flag && flag.disqualified ? ' active-dq' : ''}" id="toggle-dq-${sub.id}" data-active="${flag && flag.disqualified ? '1' : '0'}">Disqualified</div>
      </div>
      <textarea class="admin-reason" id="reason-${sub.id}" placeholder="Reason (visible to other judges)">${flag ? escapeHtml(flag.reason || '') : ''}</textarea>
      <button class="admin-save" id="save-flag-${sub.id}">Save Flag Status</button>
      <div class="save-status" id="flag-status-${sub.id}"></div>
    </div>` : '';

  card.innerHTML = `
    ${photosHtml}
    <div class="card-head">
      <div>
        <div class="entry-tag">${sub.submission_id || ''} ${sub.entry_number ? '· #' + sub.entry_number : ''}</div>
        <div class="model-name">${escapeHtml(sub.model_name || 'Untitled')}</div>
      </div>
      <div class="badge-row">${badges}</div>
    </div>
    <div class="meta-row">
      <b>Folder:</b> ${escapeHtml(sub.artist_name || '—')}${sub.designer ? ` &nbsp;·&nbsp; <b>Designer:</b> ${escapeHtml(sub.designer)}` : ''}<br>
      ${sub.paper_used ? `<b>Paper:</b> ${escapeHtml(sub.paper_used)} &nbsp;·&nbsp; ` : ''}${sub.difficulty ? `<b>Difficulty:</b> ${escapeHtml(sub.difficulty)}` : ''}${sub.time_taken ? ` &nbsp;·&nbsp; <b>Time:</b> ${escapeHtml(sub.time_taken)}` : ''}
    </div>
    ${sub.artistic_statement ? `<div class="statement">${escapeHtml(sub.artistic_statement)}</div>` : ''}
    ${flagNoteHtml}

    <div class="your-score">
      <div class="section-label">Your Score</div>
      <div class="criteria">
        ${CRITERIA.map(c => {
          const raw = myScore ? myScore[c.key === 'precision' ? 'precision_score' : c.key] : 5;
          const val = parseFloat(raw).toFixed(1);
          return `
          <div class="crit-field">
            <label for="${c.key}-${sub.id}">${c.label}</label>
            <input type="number" min="1" max="10" step="0.1" value="${val}"
                   id="${c.key}-${sub.id}" data-key="${c.key}">
          </div>`;
        }).join('')}
      </div>
      <div class="total-row">
        <span>Auto Total</span>
        <b id="total-${sub.id}">${myScore ? totalOf(myScore) : '30.0'} / 60</b>
      </div>
      <textarea class="comments" id="comments-${sub.id}" placeholder="Notes / constructive feedback (optional)">${myScore ? escapeHtml(myScore.comments || '') : ''}</textarea>
      <button class="save-btn" id="save-${sub.id}">Save Score</button>
      <div class="save-status" id="status-${sub.id}"></div>
    </div>

    ${othersHtml}
    ${adminPanelHtml}
  `;

  // live auto-total + clamping, manual entry only (no sliders)
  CRITERIA.forEach(c => {
    const input = card.querySelector(`#${c.key}-${sub.id}`);
    const recalc = () => {
      const total = CRITERIA.reduce((sum, cc) =>
        sum + parseFloat(card.querySelector(`#${cc.key}-${sub.id}`).value || 0), 0);
      card.querySelector(`#total-${sub.id}`).textContent = `${total.toFixed(1)} / 60`;
    };
    input.addEventListener('input', recalc);
    input.addEventListener('blur', () => {
      input.value = clampVal(input.value).toFixed(1);
      recalc();
    });
  });

  card.querySelector(`#save-${sub.id}`).addEventListener('click', () => saveScore(sub.id, card));

  if (isAdmin) {
    const flagToggle = card.querySelector(`#toggle-flag-${sub.id}`);
    const dqToggle = card.querySelector(`#toggle-dq-${sub.id}`);
    flagToggle.addEventListener('click', () => {
      const active = flagToggle.dataset.active === '1';
      flagToggle.dataset.active = active ? '0' : '1';
      flagToggle.classList.toggle('active-flag', !active);
    });
    dqToggle.addEventListener('click', () => {
      const active = dqToggle.dataset.active === '1';
      dqToggle.dataset.active = active ? '0' : '1';
      dqToggle.classList.toggle('active-dq', !active);
    });
    card.querySelector(`#save-flag-${sub.id}`).addEventListener('click', () => saveFlag(sub.id, card));
  }

  return card;
}

function totalOf(scoreRow) {
  const t = parseFloat(scoreRow.cleanliness) + parseFloat(scoreRow.precision_score) +
            parseFloat(scoreRow.shaping) + parseFloat(scoreRow.presentation) +
            parseFloat(scoreRow.folding_maturity) + parseFloat(scoreRow.overall_execution);
  return t.toFixed(1);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

async function saveScore(subId, card) {
  const btn = card.querySelector(`#save-${subId}`);
  const status = card.querySelector(`#status-${subId}`);
  btn.disabled = true; btn.textContent = 'Saving…'; status.textContent = '';

  const get = key => clampVal(card.querySelector(`#${key}-${subId}`).value);
  const comments = card.querySelector(`#comments-${subId}`).value.trim();

  const { data, error } = await sb.rpc('judging_submit_score', {
    pw: PASSWORD,
    p_submission_id: subId,
    p_judge_name: CURRENT_JUDGE,
    p_cleanliness: get('cleanliness'),
    p_precision: get('precision'),
    p_shaping: get('shaping'),
    p_presentation: get('presentation'),
    p_folding_maturity: get('folding_maturity'),
    p_overall_execution: get('overall_execution'),
    p_comments: comments,
  });

  btn.disabled = false; btn.textContent = 'Save Score';

  if (error) {
    status.style.color = 'var(--red)';
    status.textContent = 'Error saving — try again.';
    return;
  }

  allScores = allScores.filter(s => !(s.submission_id === subId && s.judge_name === CURRENT_JUDGE));
  allScores.push(data);
  status.style.color = 'var(--green)';
  status.textContent = 'Saved.';
  updateProgress();
  if (!card.querySelector('.badge.done')) {
    const badge = document.createElement('span');
    badge.className = 'badge done';
    badge.textContent = 'Scored';
    card.querySelector('.badge-row').prepend(badge);
  }
}

async function saveFlag(subId, card) {
  const btn = card.querySelector(`#save-flag-${subId}`);
  const status = card.querySelector(`#flag-status-${subId}`);
  btn.disabled = true; btn.textContent = 'Saving…'; status.textContent = '';

  const flagged = card.querySelector(`#toggle-flag-${subId}`).dataset.active === '1';
  const disqualified = card.querySelector(`#toggle-dq-${subId}`).dataset.active === '1';
  const reason = card.querySelector(`#reason-${subId}`).value.trim();

  const { data, error } = await sb.rpc('judging_set_flag', {
    pw: PASSWORD,
    p_submission_id: subId,
    p_judge_name: CURRENT_JUDGE,
    p_flagged: flagged,
    p_disqualified: disqualified,
    p_reason: reason,
  });

  btn.disabled = false; btn.textContent = 'Save Flag Status';

  if (error) {
    status.style.color = 'var(--red)';
    status.textContent = 'Error saving — try again.';
    return;
  }

  allFlags = allFlags.filter(f => f.submission_id !== subId);
  allFlags.push(data);
  status.style.color = 'var(--green)';
  status.textContent = 'Saved.';

  const fresh = renderCard(submissions.find(s => s.id === subId));
  card.replaceWith(fresh);
}
</script>
