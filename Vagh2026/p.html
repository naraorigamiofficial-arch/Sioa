<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAGH 2026 — Judging | SIOA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14;
  --panel:#141a21;
  --panel-2:#1a212a;
  --border:#262f39;
  --border-soft:#1d252e;
  --text:#f0f3f6;
  --muted:#9aa6b2;
  --accent:#4fa8c9;
  --accent-strong:#63b9d8;
  --green:#5ec98e;
  --amber:#e0b155;
  --red:#e07272;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}

/* remove number-input spinners so custom steppers are the only control */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

/* ============ LOGIN GATE ============ */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.gate-box{width:100%;max-width:380px;}
.gate-eyebrow{font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.gate-title{font-size:26px;font-weight:800;margin-bottom:10px;}
.gate-sub{font-size:14.5px;color:var(--muted);margin-bottom:28px;}
.field-label{font-size:13px;color:var(--muted);margin-bottom:7px;display:block;font-weight:500;}
.gate-input, select, textarea, input[type=number], input[type=text]{
  width:100%;padding:14px 16px;background:var(--panel);
  border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);font-family:'Inter',sans-serif;font-size:16px;
  outline:none;transition:border-color 0.15s;
}
.gate-input:focus, select:focus, textarea:focus, input[type=number]:focus{border-color:var(--accent);}
.gate-input{margin-bottom:16px;}
.gate-btn{
  width:100%;padding:15px;background:var(--accent);
  color:#0b0f14;border:none;border-radius:10px;font-family:'Inter',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;min-height:48px;
}
.gate-btn:hover{background:var(--accent-strong);}
.gate-error{color:var(--red);font-size:13.5px;margin-top:14px;min-height:16px;}

/* ============ DASHBOARD ============ */
#dashboard{display:none;}
.topbar{
  position:sticky;top:0;z-index:100;background:rgba(11,15,20,0.97);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.topbar-title{font-size:16px;font-weight:700;}
.topbar-title span{color:var(--accent);font-weight:400;}
.topbar-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.judge-pill{font-size:14px;color:var(--muted);}
.judge-pill b{color:var(--text);}
.progress-pill{font-size:13.5px;color:var(--accent);font-weight:600;background:rgba(79,168,201,0.12);padding:6px 12px;border-radius:100px;}
.logout-link{font-size:13.5px;color:var(--muted);cursor:pointer;padding:8px 4px;}
.logout-link:hover{color:var(--text);}

.wrap{max-width:1500px;margin:0 auto;padding:28px 20px 100px;}
.state-msg{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:28px;}

/* ============ CARD ============ */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;
}
.card.is-disqualified{opacity:0.6;}

.card-photos{display:flex;gap:2px;height:260px;overflow-x:auto;background:#050709;flex-shrink:0;}
.card-photos img{height:100%;width:auto;flex-shrink:0;object-fit:contain;cursor:pointer;background:#050709;}
.card-photos.single img{width:100%;object-fit:contain;}
.photo-fallback{
  height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--muted);font-size:13px;background:#10151b;text-align:center;padding:0 30px;flex-shrink:0;line-height:1.5;
}
.photo-fallback svg{width:28px;height:28px;stroke:var(--muted);opacity:0.6;}

.card-body{padding:24px;display:flex;flex-direction:column;gap:20px;}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.entry-tag{font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-weight:600;}
.model-name{font-size:21px;font-weight:700;line-height:1.3;}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.badge{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:100px;white-space:nowrap;}
.badge.done{color:var(--green);background:rgba(94,201,142,0.14);}
.badge.flagged{color:var(--amber);background:rgba(224,177,85,0.14);}
.badge.disqualified{color:var(--red);background:rgba(224,114,114,0.14);}

.meta-row{font-size:14px;color:var(--muted);}
.meta-row b{color:var(--text);font-weight:500;}

.statement{
  font-size:13.5px;color:var(--muted);line-height:1.6;padding:14px 16px;
  background:var(--panel-2);border-radius:10px;
}

/* ============ SCORE ENTRY ============ */
.section{border-top:1px solid var(--border-soft);padding-top:20px;}
.section-title{font-size:15px;font-weight:700;margin-bottom:14px;}
.section-title.admin-title{color:var(--amber);}

.crit-list{display:flex;flex-direction:column;}
.crit-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 0;border-bottom:1px solid var(--border-soft);
}
.crit-row:last-child{border-bottom:none;}
.crit-row label{font-size:15px;color:var(--text);font-weight:500;}
.stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.step-btn{
  width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:20px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  user-select:none;
}
.step-btn:active{background:var(--accent);border-color:var(--accent);color:#0b0f14;}
.crit-row input[type=number]{
  width:66px;text-align:center;font-size:17px;font-weight:700;padding:9px 4px;
}

.total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:var(--panel-2);border-radius:10px;margin-top:16px;
}
.total-row span{font-size:13.5px;color:var(--muted);font-weight:500;}
.total-row b{font-size:22px;color:var(--text);}

textarea.comments{min-height:64px;resize:vertical;font-size:14.5px;margin-top:16px;}

.save-btn{
  width:100%;padding:14px;background:var(--accent);color:#0b0f14;border:none;border-radius:10px;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;min-height:48px;
}
.save-btn:hover{background:var(--accent-strong);}
.save-btn:disabled{opacity:0.5;cursor:default;}
.save-status{font-size:13px;margin-top:10px;min-height:15px;color:var(--green);text-align:center;}

/* ============ OTHER JUDGES (view only, always visible) ============ */
.other-score-row{
  display:flex;justify-content:space-between;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--border-soft);font-size:14px;color:var(--muted);
}
.other-score-row:last-child{border-bottom:none;}
.other-score-row b{color:var(--text);}
.other-score-row .comment{display:block;margin-top:4px;color:var(--muted);font-style:italic;font-size:13.5px;}
.other-empty{font-size:14px;color:var(--muted);}

/* ============ ADMIN PANEL (Nara only, always visible) ============ */
.admin-panel{border:1.5px solid rgba(224,177,85,0.3);border-radius:12px;padding:18px;background:rgba(224,177,85,0.04);}
.admin-toggles{display:flex;gap:10px;margin-bottom:14px;}
.admin-toggle{
  flex:1;padding:12px;border-radius:10px;font-size:13.5px;font-weight:600;text-align:center;cursor:pointer;
  border:1.5px solid var(--border);background:var(--panel-2);color:var(--muted);min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.admin-toggle.active-flag{background:rgba(224,177,85,0.18);border-color:var(--amber);color:var(--amber);}
.admin-toggle.active-dq{background:rgba(224,114,114,0.18);border-color:var(--red);color:var(--red);}
.admin-reason{min-height:52px;font-size:14px;margin-bottom:14px;}
.admin-save{
  width:100%;padding:12px;background:transparent;border:1.5px solid var(--amber);color:var(--amber);
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;
}
.admin-save:hover{background:rgba(224,177,85,0.1);}

@media(max-width:520px){
  body{font-size:15px;}
  .wrap{padding:20px 14px 80px;}
  .grid{grid-template-columns:1fr;gap:22px;}
  .card-body{padding:20px;}
  .model-name{font-size:19px;}
  .topbar{padding:14px 16px;}
}
</style>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div class="gate" id="gate">
  <div class="gate-box">
    <p class="gate-eyebrow">SIOA · Private</p>
    <h1 class="gate-title">VAGH 2026 Judging</h1>
    <p class="gate-sub">Enter the shared judging password and select your name to continue.</p>
    <label class="field-label">Password</label>
    <input class="gate-input" type="password" id="pwInput" placeholder="Judging password" autocomplete="off">
    <label class="field-label">Your name</label>
    <select class="gate-input" id="judgeSelect">
      <option value="">Select…</option>
      <option value="Boice">Boice</option>
      <option value="Sampreet">Sampreet</option>
      <option value="Nara">Nara</option>
    </select>
    <button class="gate-btn" id="enterBtn">Enter</button>
    <p class="gate-error" id="gateError"></p>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-title">VAGH 2026 <span>Judging</span></div>
    <div class="topbar-right">
      <span class="progress-pill" id="progressPill"></span>
      <span class="judge-pill">Judging as <b id="currentJudgeLabel"></b></span>
      <span class="logout-link" id="logoutBtn">Log out</span>
    </div>
  </div>
  <div class="wrap">
    <div class="state-msg" id="stateMsg">Loading submissions…</div>
    <div class="grid" id="grid" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// CONFIG — set this to your real Supabase Storage bucket name
// ============================================================
const sb = window.supabase.createClient(
  "https://zbgvgzzaejaxrgcjjovc.supabase.co",
  "sb_publishable_gCLTB6WM95Iw6Txcf2fjCA_5fnXPw77"
);
const IMAGE_BUCKET = "competition_media"; // confirmed Public in Supabase Storage

const CRITERIA = [
  { key: "cleanliness",       label: "Cleanliness" },
  { key: "precision",         label: "Precision" },
  { key: "shaping",           label: "Shaping" },
  { key: "presentation",      label: "Presentation" },
  { key: "folding_maturity",  label: "Folding Maturity" },
  { key: "overall_execution", label: "Overall Execution" },
];

let PASSWORD = null;
let CURRENT_JUDGE = null;
let submissions = [];
let allScores = [];
let allFlags = [];

// ============================================================
// AUTH GATE
// ============================================================
const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const gateError = document.getElementById('gateError');

async function tryLogin(pw, judge) {
  gateError.textContent = '';
  const { data, error } = await sb.rpc('judging_login', { pw });
  if (error || data !== true) {
    gateError.textContent = 'Incorrect password.';
    return false;
  }
  PASSWORD = pw;
  CURRENT_JUDGE = judge;
  sessionStorage.setItem('vagh_judge_pw', pw);
  sessionStorage.setItem('vagh_judge_name', judge);
  return true;
}

document.getElementById('enterBtn').addEventListener('click', async () => {
  const pw = document.getElementById('pwInput').value.trim();
  const judge = document.getElementById('judgeSelect').value;
  if (!pw) { gateError.textContent = 'Enter the password.'; return; }
  if (!judge) { gateError.textContent = 'Select your name.'; return; }
  const btn = document.getElementById('enterBtn');
  btn.disabled = true; btn.textContent = 'Checking…';
  const ok = await tryLogin(pw, judge);
  btn.disabled = false; btn.textContent = 'Enter';
  if (ok) enterDashboard();
});

document.getElementById('pwInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('enterBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('vagh_judge_pw');
  sessionStorage.removeItem('vagh_judge_name');
  location.reload();
});

(async function autoResume() {
  const pw = sessionStorage.getItem('vagh_judge_pw');
  const judge = sessionStorage.getItem('vagh_judge_name');
  if (pw && judge) {
    const ok = await tryLogin(pw, judge);
    if (ok) enterDashboard();
  }
})();

// ============================================================
// DASHBOARD
// ============================================================
function enterDashboard() {
  gate.style.display = 'none';
  dashboard.style.display = 'block';
  document.getElementById('currentJudgeLabel').textContent = CURRENT_JUDGE;
  loadData();
}

function imgUrl(path) {
  if (!path) return null;
  if (path.startsWith('http')) return path;
  return sb.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

async function loadData() {
  const stateMsg = document.getElementById('stateMsg');
  const grid = document.getElementById('grid');
  stateMsg.style.display = 'block'; stateMsg.textContent = 'Loading submissions…';
  grid.style.display = 'none';

  const [subsRes, scoresRes, flagsRes] = await Promise.all([
    sb.rpc('judging_get_submissions', { pw: PASSWORD }),
    sb.rpc('judging_get_scores', { pw: PASSWORD }),
    sb.rpc('judging_get_flags', { pw: PASSWORD }),
  ]);

  if (subsRes.error) {
    stateMsg.textContent = 'Could not load submissions: ' + subsRes.error.message;
    return;
  }
  submissions = subsRes.data || [];
  allScores = scoresRes.data || [];
  allFlags = flagsRes.data || [];

  if (submissions.length === 0) {
    stateMsg.textContent = 'No submissions yet.';
    return;
  }

  stateMsg.style.display = 'none';
  grid.style.display = 'grid';
  renderGrid();
}

function scoresFor(submissionId) {
  return allScores.filter(s => s.submission_id === submissionId);
}
function flagFor(submissionId) {
  return allFlags.find(f => f.submission_id === submissionId) || null;
}

// Non-admin judges never see flagged/disqualified entries at all —
// only Nara (who manages flags) sees the full list.
function visibleSubmissions() {
  if (CURRENT_JUDGE === 'Nara') return submissions;
  return submissions.filter(s => {
    const f = flagFor(s.id);
    return !(f && (f.flagged || f.disqualified));
  });
}

function updateProgress() {
  const visible = visibleSubmissions();
  const done = visible.filter(s =>
    scoresFor(s.id).some(sc => sc.judge_name === CURRENT_JUDGE)
  ).length;
  document.getElementById('progressPill').textContent =
    `${done} / ${visible.length} scored`;
}

function renderGrid() {
  updateProgress();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  visibleSubmissions().forEach(sub => grid.appendChild(renderCard(sub)));
}

function clampVal(v) {
  v = parseFloat(v);
  if (isNaN(v)) return 5.0;
  if (v < 1) v = 1;
  if (v > 10) v = 10;
  return Math.round(v * 10) / 10;
}

const brokenImageIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;

function renderCard(sub) {
  const card = document.createElement('div');
  const myScore = scoresFor(sub.id).find(s => s.judge_name === CURRENT_JUDGE);
  const flag = flagFor(sub.id);
  const isAdmin = CURRENT_JUDGE === 'Nara';

  let classes = 'card';
  if (flag && flag.disqualified) classes += ' is-disqualified';
  card.className = classes;

  // photos — with graceful fallback if the bucket/path is wrong
  const paths = sub.image_paths || [];
  let photosHtml;
  if (paths.length === 0) {
    photosHtml = `<div class="photo-fallback">${brokenImageIcon}No photo attached</div>`;
  } else {
    photosHtml = `<div class="card-photos${paths.length === 1 ? ' single' : ''}">` +
      paths.map(p => `<img src="${imgUrl(p)}" loading="lazy" onclick="window.open('${imgUrl(p)}','_blank')" onerror="handleImgError(this)">`).join('') +
      `</div>`;
  }

  // badges — flag/disqualified badges only ever render for Nara, since
  // non-admin judges never see these cards in the first place
  let badges = '';
  if (myScore) badges += '<span class="badge done">Scored</span>';
  if (isAdmin && flag && flag.disqualified) badges += '<span class="badge disqualified">Disqualified</span>';
  else if (isAdmin && flag && flag.flagged) badges += '<span class="badge flagged">Flagged</span>';

  // other judges — always visible, strictly read-only
  const others = scoresFor(sub.id).filter(s => s.judge_name !== CURRENT_JUDGE);
  const othersHtml = `
    <div class="section">
      <div class="section-title">Other Judges (view only)</div>
      ${others.length ? others.map(o => `
        <div class="other-score-row">
          <span><b>${o.judge_name}</b> — ${totalOf(o)} / 60</span>
          ${o.comments ? `<span class="comment">"${escapeHtml(o.comments)}"</span>` : ''}
        </div>
      `).join('') : '<div class="other-empty">No other scores yet.</div>'}
    </div>`;

  const adminPanelHtml = isAdmin ? `
    <div class="section">
      <div class="section-title admin-title">Admin — Flag / Disqualify</div>
      <div class="admin-panel">
        <div class="admin-toggles">
          <div class="admin-toggle${flag && flag.flagged ? ' active-flag' : ''}" id="toggle-flag-${sub.id}" data-active="${flag && flag.flagged ? '1' : '0'}">Flagged</div>
          <div class="admin-toggle${flag && flag.disqualified ? ' active-dq' : ''}" id="toggle-dq-${sub.id}" data-active="${flag && flag.disqualified ? '1' : '0'}">Disqualified</div>
        </div>
        <textarea class="admin-reason" id="reason-${sub.id}" placeholder="Reason (visible to other judges)">${flag ? escapeHtml(flag.reason || '') : ''}</textarea>
        <button class="admin-save" id="save-flag-${sub.id}">Save Flag Status</button>
        <div class="save-status" id="flag-status-${sub.id}"></div>
      </div>
    </div>` : '';

  card.innerHTML = `
    ${photosHtml}
    <div class="card-body">
      <div class="card-head">
        <div>
          <div class="entry-tag">${sub.submission_id || ''} ${sub.entry_number ? '· #' + sub.entry_number : ''}</div>
          <div class="model-name">${escapeHtml(sub.model_name || 'Untitled')}</div>
        </div>
        <div class="badge-row">${badges}</div>
      </div>
      <div class="meta-row">
        <b>Folder:</b> ${escapeHtml(sub.artist_name || '—')}${sub.designer ? ` &nbsp;·&nbsp; <b>Designer:</b> ${escapeHtml(sub.designer)}` : ''}<br>
        ${sub.paper_used ? `<b>Paper:</b> ${escapeHtml(sub.paper_used)} &nbsp;·&nbsp; ` : ''}${sub.difficulty ? `<b>Difficulty:</b> ${escapeHtml(sub.difficulty)}` : ''}${sub.time_taken ? ` &nbsp;·&nbsp; <b>Time:</b> ${escapeHtml(sub.time_taken)}` : ''}
      </div>
      ${sub.artistic_statement ? `<div class="statement">${escapeHtml(sub.artistic_statement)}</div>` : ''}

      <div class="section">
        <div class="section-title">Your Score</div>
        <div class="crit-list">
          ${CRITERIA.map(c => {
            const raw = myScore ? myScore[c.key === 'precision' ? 'precision_score' : c.key] : 5;
            const val = parseFloat(raw).toFixed(1);
            return `
            <div class="crit-row">
              <label for="${c.key}-${sub.id}">${c.label}</label>
              <div class="stepper">
                <div class="step-btn" data-dir="-1" data-key="${c.key}" data-sub="${sub.id}">−</div>
                <input type="number" min="1" max="10" step="0.1" value="${val}"
                       id="${c.key}-${sub.id}" data-key="${c.key}">
                <div class="step-btn" data-dir="1" data-key="${c.key}" data-sub="${sub.id}">+</div>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="total-row">
          <span>Auto Total</span>
          <b id="total-${sub.id}">${myScore ? totalOf(myScore) : '30.0'} / 60</b>
        </div>
        <textarea class="comments" id="comments-${sub.id}" placeholder="Notes / feedback (optional)">${myScore ? escapeHtml(myScore.comments || '') : ''}</textarea>
        <button class="save-btn" id="save-${sub.id}">Save Score</button>
        <div class="save-status" id="status-${sub.id}"></div>
      </div>

      ${othersHtml}
      ${adminPanelHtml}
    </div>
  `;

  // stepper buttons + manual typing, both update the live total
  CRITERIA.forEach(c => {
    const input = card.querySelector(`#${c.key}-${sub.id}`);
    const recalc = () => {
      const total = CRITERIA.reduce((sum, cc) =>
        sum + parseFloat(card.querySelector(`#${cc.key}-${sub.id}`).value || 0), 0);
      card.querySelector(`#total-${sub.id}`).textContent = `${total.toFixed(1)} / 60`;
    };
    input.addEventListener('input', recalc);
    input.addEventListener('blur', () => {
      input.value = clampVal(input.value).toFixed(1);
      recalc();
    });
  });

  card.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key, subId = btn.dataset.sub, dir = parseFloat(btn.dataset.dir);
      const input = card.querySelector(`#${key}-${subId}`);
      input.value = clampVal(parseFloat(input.value) + dir * 0.5).toFixed(1);
      input.dispatchEvent(new Event('input'));
    });
  });

  card.querySelector(`#save-${sub.id}`).addEventListener('click', () => saveScore(sub.id, card));

  if (isAdmin) {
    const flagToggle = card.querySelector(`#toggle-flag-${sub.id}`);
    const dqToggle = card.querySelector(`#toggle-dq-${sub.id}`);
    flagToggle.addEventListener('click', () => {
      const active = flagToggle.dataset.active === '1';
      flagToggle.dataset.active = active ? '0' : '1';
      flagToggle.classList.toggle('active-flag', !active);
    });
    dqToggle.addEventListener('click', () => {
      const active = dqToggle.dataset.active === '1';
      dqToggle.dataset.active = active ? '0' : '1';
      dqToggle.classList.toggle('active-dq', !active);
    });
    card.querySelector(`#save-flag-${sub.id}`).addEventListener('click', () => saveFlag(sub.id, card));
  }

  return card;
}

// If an image 404s (wrong bucket name / private bucket), swap the whole
// strip for a clear diagnostic instead of a silently broken image icon.
function handleImgError(imgEl) {
  const container = imgEl.closest('.card-photos');
  if (container && !container.dataset.fallbackShown) {
    container.dataset.fallbackShown = '1';
    container.outerHTML = `<div class="photo-fallback">${brokenImageIcon}Image failed to load — check IMAGE_BUCKET name / bucket is Public in judging.html</div>`;
  }
}

function totalOf(scoreRow) {
  const t = parseFloat(scoreRow.cleanliness) + parseFloat(scoreRow.precision_score) +
            parseFloat(scoreRow.shaping) + parseFloat(scoreRow.presentation) +
            parseFloat(scoreRow.folding_maturity) + parseFloat(scoreRow.overall_execution);
  return t.toFixed(1);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

async function saveScore(subId, card) {
  const btn = card.querySelector(`#save-${subId}`);
  const status = card.querySelector(`#status-${subId}`);
  btn.disabled = true; btn.textContent = 'Saving…'; status.textContent = '';

  const get = key => clampVal(card.querySelector(`#${key}-${subId}`).value);
  const comments = card.querySelector(`#comments-${subId}`).value.trim();

  const { data, error } = await sb.rpc('judging_submit_score', {
    pw: PASSWORD,
    p_submission_id: subId,
    p_judge_name: CURRENT_JUDGE,
    p_cleanliness: get('cleanliness'),
    p_precision: get('precision'),
    p_shaping: get('shaping'),
    p_presentation: get('presentation'),
    p_folding_maturity: get('folding_maturity'),
    p_overall_execution: get('overall_execution'),
    p_comments: comments,
  });

  btn.disabled = false; btn.textContent = 'Save Score';

  if (error) {
    status.style.color = 'var(--red)';
    status.textContent = 'Error saving — try again.';
    return;
  }

  allScores = allScores.filter(s => !(s.submission_id === subId && s.judge_name === CURRENT_JUDGE));
  allScores.push(data);
  status.style.color = 'var(--green)';
  status.textContent = 'Saved.';
  updateProgress();
  if (!card.querySelector('.badge.done')) {
    const badge = document.createElement('span');
    badge.className = 'badge done';
    badge.textContent = 'Scored';
    card.querySelector('.badge-row').prepend(badge);
  }
}

async function saveFlag(subId, card) {
  const btn = card.querySelector(`#save-flag-${subId}`);
  const status = card.querySelector(`#flag-status-${subId}`);
  btn.disabled = true; btn.textContent = 'Saving…'; status.textContent = '';

  const flagged = card.querySelector(`#toggle-flag-${subId}`).dataset.active === '1';
  const disqualified = card.querySelector(`#toggle-dq-${subId}`).dataset.active === '1';
  const reason = card.querySelector(`#reason-${subId}`).value.trim();

  const { data, error } = await sb.rpc('judging_set_flag', {
    pw: PASSWORD,
    p_submission_id: subId,
    p_judge_name: CURRENT_JUDGE,
    p_flagged: flagged,
    p_disqualified: disqualified,
    p_reason: reason,
  });

  btn.disabled = false; btn.textContent = 'Save Flag Status';

  if (error) {
    status.style.color = 'var(--red)';
    status.textContent = 'Error saving — try again.';
    return;
  }

  allFlags = allFlags.filter(f => f.submission_id !== subId);
  allFlags.push(data);
  status.style.color = 'var(--green)';
  status.textContent = 'Saved.';

  // Re-render the whole grid: flagging/disqualifying changes what
  // non-admin judges will see.
  renderGrid();
}
</script>
